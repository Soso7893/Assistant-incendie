<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102b45"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Assistant Incendie"><link rel="manifest" href="manifest.webmanifest"><title>Assistant Incendie V2 — Démo sécurisée</title><style>*{box-sizing:border-box}body{margin:0;background:#f2f5f9;color:#172a3b;font-family:-apple-system,BlinkMacSystemFont,system-ui}header{background:#102b45;color:white;padding:28px 18px}h1{font-size:23px;margin:0}header p{color:#b9d1e3;font-size:13px}main{padding:18px 16px 105px;max-width:600px;margin:auto}h2{font-size:20px}section{background:white;border-radius:15px;padding:16px;margin:12px 0;box-shadow:0 2px 12px #19324b0c}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:12px 0}.muted{font-size:12px;color:#6c7b89}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{border:0;border-radius:12px;background:#12649a;color:white;padding:13px 10px;font-size:14px;font-weight:600}button.light{background:#e8f0f6;color:#23415b}select,input{width:100%;padding:12px;border:1px solid #d4dfe9;border-radius:10px;background:white;font-size:15px}nav{position:fixed;bottom:0;background:white;left:0;right:0;display:flex;justify-content:space-around;border-top:1px solid #e3e8ee;padding:10px 4px max(12px,env(safe-area-inset-bottom))}nav button{font-size:12px;background:white;color:#183b55;padding:8px}.tag{font-size:12px;background:#e9f5e9;border-radius:7px;padding:5px 8px}.notice{background:#fff3db;border-radius:10px;padding:12px;font-size:13px}b{font-weight:700}
.lock{max-width:460px;margin:22px auto}.danger{color:#8d2424}.small{font-size:12px;color:#576675}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1}.tag{font-size:12px;background:#e7f1fa;padding:5px 9px;border-radius:8px}.hidden{display:none!important}input[type=password]{width:100%;padding:13px;border:1px solid #aab9c7;border-radius:9px;margin:8px 0 14px}button:disabled{opacity:.55} .notice{line-height:1.5}</style></head><body><header><h1>🛡️ Assistant Incendie</h1><p>V2 — démonstration chiffrée · données fictives uniquement</p></header><main id="app"></main><nav id="nav" class="hidden"><button onclick="show('home')">⌂ Accueil</button><button onclick="show('sites')">▤ Sites</button><button onclick="show('devis')">▣ Devis</button><button onclick="show('relances')">◷ Relances</button></nav><script>

'use strict';
const $=id=>document.getElementById(id), el=$('app');
const encoder=new TextEncoder(),decoder=new TextDecoder();
const demo=()=>({quotes:[{ref:'DEMO-D001',name:'Vérification extincteurs',amount:450,status:'À confirmer'},{ref:'DEMO-D002',name:'Éclairage de sécurité',amount:1000,status:'À confirmer'}],reminders:[]});
const sites=[{name:'Résidence Démonstration A',city:'Ville Exemple',id:'DEMO-001',devis:1450,contrat:680},{name:'Résidence Démonstration B',city:'Ville Exemple',id:'DEMO-002',devis:720,contrat:320}];
let vault=null,passphrase=null, unlocked=false;
const keyName='assistant-incendie-v2-encrypted';
const money=n=>Number(n).toLocaleString('fr-FR',{style:'currency',currency:'EUR'});
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const b64=a=>btoa(String.fromCharCode(...new Uint8Array(a)));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const random=n=>crypto.getRandomValues(new Uint8Array(n));
async function derive(pass,salt){let base=await crypto.subtle.importKey('raw',encoder.encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:310000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function seal(data,pass){let salt=random(16),iv=random(12),key=await derive(pass,salt);let ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,encoder.encode(JSON.stringify(data)));return {format:'assistant-incendie-v2',version:2,kdf:'PBKDF2-SHA256',iterations:310000,salt:b64(salt),iv:b64(iv),ciphertext:b64(ct)}}
async function openSeal(pkg,pass){if(pkg?.format!=='assistant-incendie-v2'||pkg.version!==2||pkg.iterations!==310000)throw Error('Format non reconnu');let key=await derive(pass,unb64(pkg.salt));let data=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(pkg.iv)},key,unb64(pkg.ciphertext));let result=JSON.parse(decoder.decode(data));if(!Array.isArray(result.quotes)||!Array.isArray(result.reminders))throw Error('Sauvegarde incorrecte');return result}
async function persist(){if(!unlocked)return;let pkg=await seal(vault,passphrase);localStorage.setItem(keyName,JSON.stringify(pkg))}
function lock(){vault=null;passphrase=null;unlocked=false;$('nav').classList.add('hidden');renderLock()}
function renderLock(){let exists=!!localStorage.getItem(keyName);el.innerHTML=`<section class="lock"><h2>🔐 ${exists?'Déverrouiller':'Créer un coffre chiffré'}</h2><p class="small">Cette version contient uniquement des exemples fictifs. Le code de l'application reste public, mais les modifications sont chiffrées sur cet appareil.</p><label>Phrase secrète<input type="password" id="pass" autocomplete="off" placeholder="Au moins 12 caractères"></label>${exists?'':`<label>Confirmer la phrase secrète<input type="password" id="confirm" autocomplete="off"></label>`}<button id="unlock">${exists?'Déverrouiller':'Créer mon coffre'}</button><p id="error" class="danger"></p><p class="notice"><b>À retenir :</b> sans ta phrase secrète, tes données chiffrées sont irrécupérables. Sauvegarde-les régulièrement. Le chiffrement ne protège pas contre tous les risques liés au téléphone ou au navigateur.</p></section>`;$('unlock').onclick=async()=>{let pass=$('pass').value;let err=$('error');err.textContent='';if(pass.length<12){err.textContent='Choisis une phrase secrète de 12 caractères minimum.';return}if(!exists&&pass!==$('confirm').value){err.textContent='Les deux phrases ne correspondent pas.';return}let btn=$('unlock');btn.disabled=true;try{let data=exists?await openSeal(JSON.parse(localStorage.getItem(keyName)),pass):demo();vault=data;passphrase=pass;unlocked=true;if(!exists)await persist();$('nav').classList.remove('hidden');show('home')}catch(e){err.textContent='Phrase incorrecte ou sauvegarde illisible.'}finally{btn.disabled=false}}}
function show(p){if(!unlocked)return renderLock();let s='';if(p==='home')s=`<h2>Bonjour 👋</h2><div class="grid"><section>Résidences<h2>2</h2></section><section>Propositions HT<h2>${money(3170)}</h2></section></div><section><h2>Mon espace commercial</h2><div class="grid"><button onclick="show('sites')">🏢 Syndics et sites</button><button onclick="show('devis')">📄 Devis et contrats</button><button onclick="show('relances')">📅 Relances</button><button onclick="show('maintenance')">🛠 Maintenance</button></div></section><section><h2>🔒 Coffre et sauvegardes</h2><div class="actions"><button onclick="exportBackup()">Exporter la sauvegarde chiffrée</button><button onclick="document.getElementById('restore').click()">Restaurer une sauvegarde</button><button onclick="lock()">Verrouiller</button></div><input class="hidden" type="file" id="restore" accept=".json,application/json" onchange="importBackup(event)"><p class="small">Conserve le fichier exporté dans un endroit sûr, distinct du navigateur. Une restauration remplace les modifications actuelles après confirmation.</p></section><p class="notice">⚠️ Version de test uniquement. Ne saisis pas de données réelles ou de documents clients. Le fonctionnement hors connexion nécessite une première visite en ligne après la mise à jour et un navigateur compatible.</p>`;
if(p==='sites')s='<h2>Résidences fictives</h2>'+sites.map(x=>`<section><div class="row"><div><b>${x.name}</b><div class="muted">${x.city} · Site ${x.id}</div></div><b>${money(x.devis+x.contrat)}</b></div><div class="muted">Devis ${money(x.devis)} · Maintenance ${money(x.contrat)}/an</div></section>`).join('');
if(p==='devis')s='<h2>Devis fictifs</h2>'+vault.quotes.map((x,i)=>`<section><div class="row"><div><b>${escapeHtml(x.ref)}</b><div class="muted">${escapeHtml(x.name)}</div></div><b>${money(x.amount)}</b></div><select aria-label="Statut ${escapeHtml(x.ref)}" onchange="setStatus(${i},this.value)">${['À confirmer','À relancer','Accepté','Réalisé','Facturé'].map(v=>`<option ${x.status===v?'selected':''}>${v}</option>`).join('')}</select></section>`).join('');
if(p==='maintenance')s='<h2>Maintenance fictive</h2><section><div class="row"><span>Extincteurs · 10 unités</span><b>120,00 €</b></div><div class="row"><span>BAES · 20 unités</span><b>160,00 €</b></div><div class="row"><span>Désenfumage</span><b>300,00 €</b></div><div class="row"><span>Frais annexes</span><b>100,00 €</b></div><hr><div class="row"><b>Total annuel HT</b><b>680,00 €</b></div></section>';
if(p==='relances')s=`<h2>Relances de démonstration</h2><section><label>Objet<input id="title" placeholder="Relancer un syndic fictif"></label><label>Date<input type="date" id="date"></label><div style="margin-top:12px"><button onclick="addReminder()">Ajouter</button></div></section>`+vault.reminders.map((r,i)=>`<section class="row"><div><b>${escapeHtml(r.title)}</b><div class="muted">${escapeHtml(r.date)}</div></div><button class="light" onclick="removeReminder(${i})">Terminé</button></section>`).join('');el.innerHTML=s}
async function setStatus(i,value){vault.quotes[i].status=value;try{await persist()}catch(e){alert('Échec de sauvegarde : espace de stockage indisponible')}}
async function addReminder(){let title=$('title').value.trim(),date=$('date').value;if(!title||!date)return alert('Indique un objet et une date');vault.reminders.push({title,date});try{await persist();show('relances')}catch(e){alert('Impossible de sauvegarder')}}
async function removeReminder(i){vault.reminders.splice(i,1);await persist();show('relances')}
async function exportBackup(){try{let pkg=await seal(vault,passphrase);let blob=new Blob([JSON.stringify(pkg,null,2)],{type:'application/json'});let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='assistant-incendie-sauvegarde-chiffree-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}catch(e){alert('Export impossible')}}
async function importBackup(event){let file=event.target.files?.[0];if(!file)return;try{if(file.size>2000000)throw Error('Fichier trop volumineux');let pkg=JSON.parse(await file.text());let imported=await openSeal(pkg,passphrase);if(!confirm('Remplacer toutes les modifications locales par cette sauvegarde ?'))return;vault=imported;await persist();show('home');alert('Sauvegarde restaurée.')}catch(e){alert('Restauration impossible : vérifie le fichier et sa phrase secrète.')}finally{event.target.value=''}}
if(!window.crypto?.subtle){el.innerHTML='<section>Ce navigateur ne permet pas le chiffrement. Ouvre l’application depuis son adresse HTTPS dans Safari.</section>'}else{renderLock();if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{})}
</script></body></html>
