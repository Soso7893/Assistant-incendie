<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102b45"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Assistant Incendie"><link rel="manifest" href="manifest.webmanifest"><title>Assistant Incendie — Démo</title><style>*{box-sizing:border-box}body{margin:0;background:#f2f5f9;color:#172a3b;font-family:-apple-system,BlinkMacSystemFont,system-ui}header{background:#102b45;color:white;padding:28px 18px}h1{font-size:23px;margin:0}header p{color:#b9d1e3;font-size:13px}main{padding:18px 16px 105px;max-width:600px;margin:auto}h2{font-size:20px}section{background:white;border-radius:15px;padding:16px;margin:12px 0;box-shadow:0 2px 12px #19324b0c}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:12px 0}.muted{font-size:12px;color:#6c7b89}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{border:0;border-radius:12px;background:#12649a;color:white;padding:13px 10px;font-size:14px;font-weight:600}button.light{background:#e8f0f6;color:#23415b}select,input{width:100%;padding:12px;border:1px solid #d4dfe9;border-radius:10px;background:white;font-size:15px}nav{position:fixed;bottom:0;background:white;left:0;right:0;display:flex;justify-content:space-around;border-top:1px solid #e3e8ee;padding:10px 4px max(12px,env(safe-area-inset-bottom))}nav button{font-size:12px;background:white;color:#183b55;padding:8px}.tag{font-size:12px;background:#e9f5e9;border-radius:7px;padding:5px 8px}.notice{background:#fff3db;border-radius:10px;padding:12px;font-size:13px}b{font-weight:700}</style></head><body><header><h1>🛡️ Assistant Incendie</h1><p>Démo gratuite — données entièrement fictives</p></header><main id="app"></main><nav><button onclick="show('home')">⌂ Accueil</button><button onclick="show('sites')">▤ Sites</button><button onclick="show('devis')">▣ Devis</button><button onclick="show('relances')">◷ Relances</button></nav><script>
const sites=[{name:'Résidence Démonstration A',city:'Ville Exemple',id:'DEMO-001',devis:1450,contrat:680},{name:'Résidence Démonstration B',city:'Ville Exemple',id:'DEMO-002',devis:720,contrat:320}];const quotes=[{ref:'DEMO-D001',name:'Vérification extincteurs',amount:450},{ref:'DEMO-D002',name:'Éclairage de sécurité',amount:1000}];let statuses={};try{statuses=JSON.parse(localStorage.getItem('demo-incendie-status')||'{}')}catch(e){}let reminders=[];try{reminders=JSON.parse(localStorage.getItem('demo-incendie-reminders')||'[]')}catch(e){}const money=n=>Number(n).toLocaleString('fr-FR',{style:'currency',currency:'EUR'});const el=document.getElementById('app');function show(p){let s='';if(p==='home')s=`<h2>Bonjour 👋</h2><div class="grid"><section>Résidences<h2>2</h2></section><section>Propositions HT<h2>${money(3170)}</h2></section></div><section><h2>Mon espace commercial</h2><div class="grid"><button onclick="show('sites')">🏢 Syndics et sites</button><button onclick="show('devis')">📄 Devis et contrats</button><button onclick="show('relances')">📅 Relances</button><button onclick="show('maintenance')">🛠 Maintenance</button></div></section><p class="notice">Démonstration publique : aucune donnée client réelle. Les modifications sont conservées localement sur cet appareil, sans synchronisation ni garantie de sauvegarde.</p>`;if(p==='sites')s='<h2>Résidences fictives</h2>'+sites.map(x=>`<section><div class="row"><div><b>${x.name}</b><div class="muted">${x.city} · Site ${x.id}</div></div><b>${money(x.devis+x.contrat)}</b></div><div class="muted">Devis ${money(x.devis)} · Maintenance ${money(x.contrat)}/an</div></section>`).join('');if(p==='devis')s='<h2>Devis fictifs</h2>'+quotes.map((x,i)=>`<section><div class="row"><div><b>${x.ref}</b><div class="muted">${x.name}</div></div><b>${money(x.amount)}</b></div><select aria-label="Statut ${x.ref}" onchange="statuses['${x.ref}']=this.value;localStorage.setItem('demo-incendie-status',JSON.stringify(statuses))">${['À confirmer','À relancer','Accepté','Réalisé','Facturé'].map(v=>`<option ${statuses[x.ref]===v?'selected':''}>${v}</option>`).join('')}</select></section>`).join('');if(p==='maintenance')s='<h2>Maintenance fictive</h2><section><div class="row"><span>Extincteurs · 10 unités</span><b>120,00 €</b></div><div class="row"><span>BAES · 20 unités</span><b>160,00 €</b></div><div class="row"><span>Désenfumage</span><b>300,00 €</b></div><div class="row"><span>Frais annexes</span><b>100,00 €</b></div><hr><div class="row"><b>Total annuel HT</b><b>680,00 €</b></div></section>';if(p==='relances')s=`<h2>Relances de démonstration</h2><section><label>Objet<input id="title" placeholder="Relancer un syndic fictif"></label><label>Date<input type="date" id="date"></label><div style="margin-top:12px"><button onclick="addReminder()">Ajouter</button></div></section>`+reminders.map((r,i)=>`<section class="row"><div><b>${r.title.replaceAll('<','&lt;')}</b><div class="muted">${r.date}</div></div><button class="light" onclick="reminders.splice(${i},1);persist();show('relances')">Terminé</button></section>`).join('');el.innerHTML=s}function persist(){try{localStorage.setItem('demo-incendie-reminders',JSON.stringify(reminders))}catch(e){}}function addReminder(){let title=document.getElementById('title').value.trim(),date=document.getElementById('date').value;if(!title||!date)return alert('Indique un objet et une date');reminders.push({title,date});persist();show('relances')}show('home');
</script></body></html>
