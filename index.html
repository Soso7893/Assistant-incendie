<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102b45"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Assistant Incendie"><link rel="manifest" href="manifest.webmanifest"><title>Assistant Incendie V3.4.2 — Démo</title><style>*{box-sizing:border-box}body{margin:0;background:#f2f5f9;color:#172a3b;font-family:-apple-system,BlinkMacSystemFont,system-ui}header{background:#102b45;color:white;padding:28px 18px}h1{font-size:23px;margin:0}header p{color:#b9d1e3;font-size:13px}main{padding:18px 16px 105px;max-width:600px;margin:auto}h2{font-size:20px}section{background:white;border-radius:15px;padding:16px;margin:12px 0;box-shadow:0 2px 12px #19324b0c}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:12px 0}.muted{font-size:12px;color:#6c7b89}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{border:0;border-radius:12px;background:#12649a;color:white;padding:13px 10px;font-size:14px;font-weight:600}button.light{background:#e8f0f6;color:#23415b}select,input{width:100%;padding:12px;border:1px solid #d4dfe9;border-radius:10px;background:white;font-size:15px}nav{position:fixed;bottom:0;background:white;left:0;right:0;display:flex;justify-content:space-around;border-top:1px solid #e3e8ee;padding:10px 4px max(12px,env(safe-area-inset-bottom))}nav button{font-size:12px;background:white;color:#183b55;padding:8px}.tag{font-size:12px;background:#e9f5e9;border-radius:7px;padding:5px 8px}.notice{background:#fff3db;border-radius:10px;padding:12px;font-size:13px}b{font-weight:700}
.lock{max-width:460px;margin:22px auto}.danger{color:#8d2424}.small{font-size:12px;color:#576675}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1}.tag{font-size:12px;background:#e7f1fa;padding:5px 9px;border-radius:8px}.hidden{display:none!important}input[type=password]{width:100%;padding:13px;border:1px solid #aab9c7;border-radius:9px;margin:8px 0 14px}button:disabled{opacity:.55} .notice{line-height:1.5}</style></head><body><header><h1>🛡️ Assistant Incendie</h1><p>V3.4.2 — documents PDF · données fictives uniquement</p></header><main id="app"></main><nav id="nav" class="hidden"><button onclick="show('home')">⌂ Accueil</button><button onclick="show('syndics')">▤ Syndics</button><button onclick="show('devis')">▣ Devis</button><button onclick="show('relances')">◷ Relances</button></nav><script>
 'use strict';
const $=id=>document.getElementById(id),el=$('app');
const encoder=new TextEncoder(),decoder=new TextDecoder();
const demo=()=>({quotes:[{ref:'DEMO-D001',name:'Vérification extincteurs',amount:450,status:'À confirmer',siteId:'DEMO-001'},{ref:'DEMO-D002',name:'Éclairage de sécurité',amount:1000,status:'À confirmer',siteId:'DEMO-002'}],reminders:[],syndics:[{id:'SY-DEMO-1',name:'Syndic Exemple',contact:'Camille Martin',phone:'',email:''}],sites:[{id:'DEMO-001',name:'Résidence Démonstration A',city:'Ville Exemple',address:'1 rue Exemple',syndicId:'SY-DEMO-1',devis:1450,contrat:680},{id:'DEMO-002',name:'Résidence Démonstration B',city:'Ville Exemple',address:'2 rue Exemple',syndicId:'SY-DEMO-1',devis:720,contrat:320}]});
const defaultSyndics=demo().syndics,defaultSites=demo().sites;
let vault=null,passphrase=null,unlocked=false,current='home';
const keyName='assistant-incendie-v2-encrypted'; // même coffre que V2 : migration sans suppression
// Coffre chiffré conservé en IndexedDB (quota mieux adapté aux PDF).
// L'ancien localStorage est conservé intact comme copie de secours V3.4.1.
const dbName='assistant-incendie-v342', storeName='vault';
function openDb(){return new Promise((resolve,reject)=>{const r=indexedDB.open(dbName,1);r.onupgradeneeded=()=>r.result.createObjectStore(storeName);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function readIdb(){const db=await openDb();try{return await new Promise((resolve,reject)=>{const tx=db.transaction(storeName,'readonly'),r=tx.objectStore(storeName).get('encrypted');r.onsuccess=()=>resolve(r.result||null);r.onerror=()=>reject(r.error)})}finally{db.close()}}
async function writeIdb(value){const db=await openDb();try{await new Promise((resolve,reject)=>{const tx=db.transaction(storeName,'readwrite');tx.objectStore(storeName).put(value,'encrypted');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error)})}finally{db.close()}}
let activeStore='legacy';

const money=n=>Number(n||0).toLocaleString('fr-FR',{style:'currency',currency:'EUR'});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const b64=a=>btoa(String.fromCharCode(...new Uint8Array(a)));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const random=n=>crypto.getRandomValues(new Uint8Array(n));
const uid=()=>Array.from(random(12),n=>n.toString(16).padStart(2,'0')).join('');
async function derive(pass,salt){let base=await crypto.subtle.importKey('raw',encoder.encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:310000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function seal(data,pass){let salt=random(16),iv=random(12),key=await derive(pass,salt);let ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,encoder.encode(JSON.stringify(data)));return {format:'assistant-incendie-v2',version:2,kdf:'PBKDF2-SHA256',iterations:310000,salt:b64(salt),iv:b64(iv),ciphertext:b64(ct)}}
async function openSeal(pkg,pass){if(pkg?.format!=='assistant-incendie-v2'||pkg.version!==2||pkg.iterations!==310000)throw Error('Format non reconnu');let key=await derive(pass,unb64(pkg.salt));let data=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(pkg.iv)},key,unb64(pkg.ciphertext));let result=JSON.parse(decoder.decode(data));if(!Array.isArray(result.quotes)||!Array.isArray(result.reminders))throw Error('Sauvegarde incorrecte');return result}
function migrate(d){if(!Array.isArray(d.syndics))d.syndics=structuredClone(defaultSyndics);if(!Array.isArray(d.sites))d.sites=structuredClone(defaultSites);if(!Array.isArray(d.documents))d.documents=[];for(const q of d.quotes){if(!('siteId' in q))q.siteId=''}return d}
// Chaque écriture est sérialisée pour éviter qu'un chiffrement plus lent écrase une modification récente.
let writeQueue=Promise.resolve(),lastStoredValue=null,externalChange=false;
window.addEventListener('storage',e=>{if(e.key===keyName&&unlocked&&activeStore==='legacy'&&e.newValue!==lastStoredValue){externalChange=true;alert('Le coffre a changé dans un autre onglet. Ne modifie rien ici : exporte une sauvegarde puis rouvre une seule fenêtre.')}});
async function persist(){
 if(!unlocked)throw Error('Coffre verrouillé');
 const snapshot=structuredClone(vault),secret=passphrase;
 const operation=writeQueue.catch(()=>{}).then(async()=>{
  if(externalChange)throw Error('Autre onglet détecté');
  const pkg=await seal(snapshot,secret),value=JSON.stringify(pkg);
  await writeIdb(value);
  const stored=await readIdb();
  if(stored!==value)throw Error('Écriture IndexedDB non conservée');
  const checked=await openSeal(JSON.parse(stored),secret);
  if(JSON.stringify(checked)!==JSON.stringify(snapshot))throw Error('Vérification échouée');
  activeStore='idb';lastStoredValue=value;
 });
 writeQueue=operation;
 return operation;
}
async function saveAndShow(page){try{await persist();show(page)}catch(e){alert('Échec de sauvegarde : stockage indisponible. Ne ferme pas l’application avant d’avoir exporté tes données.')}}
function lock(){vault=null;passphrase=null;unlocked=false;$('nav').classList.add('hidden');renderLock()}
async function renderLock(){let idbValue=null;try{idbValue=await readIdb()}catch(e){}let exists=!!(idbValue||localStorage.getItem(keyName));el.innerHTML=`<section class="lock"><h2>🔐 ${exists?'Déverrouiller':'Créer un coffre chiffré'}</h2><p class="small">V3 de démonstration : données fictives uniquement. Les modifications sont chiffrées localement sur cet appareil.</p><label>Phrase secrète<input type="password" id="pass" autocomplete="off" placeholder="Au moins 12 caractères"></label>${exists?'':`<label>Confirmer la phrase secrète<input type="password" id="confirm" autocomplete="off"></label>`}<button id="unlock">${exists?'Déverrouiller':'Créer mon coffre'}</button><p id="error" class="danger"></p><p class="notice"><b>Attention :</b> sans la phrase secrète, les données sont irrécupérables. Sauvegarde régulièrement. Cette démo n’est pas auditée et ne doit pas recevoir de données professionnelles réelles.</p></section>`;$('unlock').onclick=async()=>{let pass=$('pass').value,err=$('error');err.textContent='';if(pass.length<12){err.textContent='Phrase secrète de 12 caractères minimum.';return}if(!exists&&pass!==$('confirm').value){err.textContent='Les deux phrases ne correspondent pas.';return}let btn=$('unlock');btn.disabled=true;try{let source=idbValue||localStorage.getItem(keyName);let data=exists?await openSeal(JSON.parse(source),pass):demo();vault=migrate(data);passphrase=pass;unlocked=true;lastStoredValue=source;activeStore=idbValue?'idb':'legacy';externalChange=false;if(!idbValue)await persist();$('nav').classList.remove('hidden');show('home')}catch(e){err.textContent='Phrase incorrecte ou sauvegarde illisible.'}finally{btn.disabled=false}}}
function syndicName(id){return vault.syndics.find(x=>x.id===id)?.name||'Non rattaché'}
function siteName(id){return vault.sites.find(x=>x.id===id)?.name||'Site non renseigné'}
function show(page){if(!unlocked)return renderLock();current=page;let s='';
if(page==='home'){let total=vault.quotes.reduce((n,q)=>n+Number(q.amount||0),0);s=`<h2>Bonjour 👋</h2><div class="grid"><section>Résidences<h2>${vault.sites.length}</h2></section><section>Devis enregistrés HT<h2>${money(total)}</h2></section></div><section><h2>Mon espace commercial</h2><div class="grid"><button onclick="show('syndics')">🏢 Syndics</button><button onclick="show('sites')">📍 Résidences</button><button onclick="show('devis')">📄 Devis</button><button onclick="show('relances')">📅 Relances</button><button onclick="show('documents')">📎 Documents PDF</button></div></section><section><h2>🔒 Coffre et sauvegardes</h2><div class="actions"><button onclick="exportBackup()">Exporter une sauvegarde chiffrée</button><button onclick="$('restore').click()">Restaurer une sauvegarde</button><button onclick="lock()">Verrouiller</button></div><input class="hidden" type="file" id="restore" accept=".json,application/json" onchange="importBackup(event)"><p class="small">Une sauvegarde V2/V3 doit être ouverte avec la phrase secrète du coffre courant. Une restauration remplace les modifications actuelles après confirmation.</p></section><p class="notice">⚠️ Démonstration uniquement. N'ajoute aucun vrai client, contact ou document. Les chiffres de cette page sont des données fictives, pas du chiffre d'affaires réalisé.</p>`}
if(page==='syndics'){s=`<h2>Syndics fictifs</h2><section><h3>Ajouter un syndic</h3><form onsubmit="addSyndic(event)"><label>Nom du syndic<input id="sn" required maxlength="100" placeholder="Syndic Démonstration"></label><label>Interlocuteur<input id="sc" maxlength="100" placeholder="Prénom Nom"></label><label>Téléphone<input id="sp" type="tel" maxlength="40"></label><label>E-mail<input id="se" type="email" maxlength="160"></label><button type="submit">Ajouter le syndic</button></form></section>`+vault.syndics.map(x=>`<section><b>${esc(x.name)}</b><div class="muted">${esc(x.contact||'Aucun interlocuteur')} ${x.phone?' · '+esc(x.phone):''}</div>${x.email?`<div class="muted">${esc(x.email)}</div>`:''}<div class="muted">${vault.sites.filter(z=>z.syndicId===x.id).length} résidence(s)</div><div class="actions"><button class="light" onclick="showSyndic('${esc(x.id)}')">Voir la fiche</button><button class="light" onclick="editSyndic('${esc(x.id)}')">Modifier</button></div></section>`).join('')}
if(page==='sites'){s=`<h2>Résidences fictives</h2><section><label>🔎 Rechercher une résidence, un syndic, un gestionnaire, un numéro de site ou un devis<input id="siteSearch" type="search" placeholder="Nom, n° site, devis…" oninput="filterSites(this.value)"></label><p id="siteSearchCount" class="small"></p></section><section><h3>Ajouter une résidence</h3><form onsubmit="addSite(event)"><label>Nom<input id="rn" required maxlength="120" placeholder="Résidence Démonstration C"></label><label>N° de site<input id="rid" required maxlength="40" placeholder="DEMO-003"></label><label>Adresse<input id="ra" maxlength="160"></label><label>Ville<input id="rc" maxlength="100"></label><label>Gestionnaire<input id="rg" maxlength="100" placeholder="Nom fictif du gestionnaire"></label><label>Syndic<select id="rs">${syndicOptions('')}</select></label><button type="submit">Ajouter la résidence</button></form></section>`+vault.sites.map(x=>`<section data-site-card="1" data-search="${esc([x.name,x.id,x.address,x.city,x.gestionnaire||'',syndicName(x.syndicId),...(vault.quotes.filter(q=>q.siteId===x.id).flatMap(q=>[q.ref,q.name])),...(vault.reminders.filter(r=>r.siteId===x.id).map(r=>r.title)),...(vault.documents.filter(d=>d.siteId===x.id).map(d=>d.name))].join(' ').toLocaleLowerCase('fr'))}"><b>${esc(x.name)}</b><div class="muted">${esc(x.address||'')} ${esc(x.city||'')} · Site ${esc(x.id)}</div><div class="muted">Syndic : ${esc(syndicName(x.syndicId))} · Gestionnaire : ${esc(x.gestionnaire||'Non renseigné')}</div><div class="actions"><button class="light" onclick="showSite('${esc(x.id)}')">Voir la fiche</button><button class="light" onclick="editSite('${esc(x.id)}')">Modifier</button></div></section>`).join('')}
if(page==='devis'){s=`<h2>Devis fictifs</h2><section><h3>+ Nouveau devis</h3><form onsubmit="addQuote(event)"><label>Numéro de devis<input id="qref" required maxlength="60" placeholder="DEMO-D003"></label><label>Objet<input id="qname" required maxlength="160" placeholder="Maintenance extincteurs"></label><label>Résidence<select id="qsite" required><option value="">Choisir une résidence</option>${vault.sites.map(x=>`<option value="${esc(x.id)}">${esc(x.name)} — ${esc(x.id)}</option>`).join('')}</select></label><label>Montant HT (€)<input id="qamount" type="number" min="0" step="0.01" required></label><label>Date du devis<input id="qdate" type="date"></label><label>Statut<select id="qstatus">${['À confirmer','À relancer','Accepté','Refusé','Réalisé','Facturé'].map(v=>`<option>${v}</option>`).join('')}</select></label><button type="submit">Enregistrer le devis</button></form></section>`+vault.quotes.map((x,i)=>`<section><div class="row"><div><b>${esc(x.ref)}</b><div class="muted">${esc(x.name)} · ${esc(siteName(x.siteId))}</div><div class="muted">${esc(x.date||'')}</div></div><b>${money(x.amount)}</b></div><select aria-label="Statut ${esc(x.ref)}" onchange="setStatus(${i},this.value)">${['À confirmer','À relancer','Accepté','Refusé','Réalisé','Facturé'].map(v=>`<option ${x.status===v?'selected':''}>${v}</option>`).join('')}</select><button class="light" onclick="remindQuote(${i})">Programmer une relance</button></section>`).join('')}
if(page==='relances'){s=`<h2>Relances fictives</h2><section><h3>+ Nouvelle relance</h3><form onsubmit="addReminder(event)"><label>Objet<input id="title" required maxlength="160" placeholder="Relancer un devis fictif"></label><label>Résidence<select id="rsite"><option value="">Sans résidence</option>${vault.sites.map(x=>`<option value="${esc(x.id)}">${esc(x.name)} — ${esc(x.id)}</option>`).join('')}</select></label><label>Devis associé (facultatif)<select id="rquote"><option value="">Aucun</option>${vault.quotes.map(x=>`<option value="${esc(x.ref)}">${esc(x.ref)} — ${esc(x.name)}</option>`).join('')}</select></label><label>Date<input type="date" id="date" required></label><button type="submit">Enregistrer la relance</button></form></section>`+vault.reminders.map((r,i)=>`<section class="row"><div><b>${esc(r.title)}</b><div class="muted">${esc(r.date)} · ${esc(siteName(r.siteId||''))} ${r.quoteRef?' · '+esc(r.quoteRef):''}</div></div><button class="light" onclick="removeReminder(${i})">Terminé</button></section>`).join('')}

if(page==='documents'){
 s=`<h2>📎 Documents PDF fictifs</h2><section><h3>Importer plusieurs PDF</h3><p class="small">Choisis plusieurs PDF fictifs, puis affecte chacun à une seule résidence. Limite de démonstration : 1,5 Mo par PDF et 3 Mo au total, pour éviter de saturer le stockage du navigateur.</p><input id="pdfInput" type="file" accept=".pdf,application/pdf" multiple onchange="preparePDFs(event)"><div id="pdfDrafts"></div></section><section><label>Rechercher un document<input id="docSearch" type="search" oninput="filterDocs(this.value)" placeholder="Nom, catégorie, résidence…"></label></section>`+vault.documents.map(d=>`<section data-doc-card data-search="${esc([d.name,d.category,siteName(d.siteId),d.siteId].join(' ').toLowerCase())}"><b>${esc(d.name)}</b><div class="muted">${esc(d.category)} · ${esc(siteName(d.siteId))} · ${Math.round(d.size/1024)} Ko</div><div class="actions"><button class="light" onclick="openPDF('${esc(d.id)}')">Ouvrir</button><button class="light" onclick="movePDF('${esc(d.id)}')">Changer résidence</button><button class="light" onclick="deletePDF('${esc(d.id)}')">Supprimer</button></div></section>`).join('')
}
if(page==='maintenance'){s='<h2>Maintenance fictive</h2><section><p>Les contrats de maintenance par résidence seront ajoutés dans une prochaine version.</p></section>'}
el.innerHTML=s}
function filterSites(value){const query=value.trim().toLocaleLowerCase('fr').normalize('NFD').replace(/[\u0300-\u036f]/g,'');let visible=0;document.querySelectorAll('[data-site-card]').forEach(card=>{const hay=(card.dataset.search||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'');const match=hay.includes(query);card.hidden=!match;if(match)visible++});let counter=$('siteSearchCount');if(counter)counter.textContent=visible+' résidence(s) trouvée(s)'}
function syndicOptions(selected){return `<option value="">Non rattaché</option>`+vault.syndics.map(x=>`<option value="${esc(x.id)}" ${x.id===selected?'selected':''}>${esc(x.name)}</option>`).join('')}
function showSyndic(id){let x=vault.syndics.find(z=>z.id===id);if(!x)return show('syndics');let attached=vault.sites.filter(z=>z.syndicId===id);el.innerHTML=`<button class="light" onclick="show('syndics')">← Syndics</button><section><h2>${esc(x.name)}</h2><p>Interlocuteur : ${esc(x.contact||'Non renseigné')}</p><p>Téléphone : ${esc(x.phone||'Non renseigné')}</p><p>E-mail : ${esc(x.email||'Non renseigné')}</p></section><h3>Résidences (${attached.length})</h3>`+attached.map(z=>`<section><b>${esc(z.name)}</b><div class="muted">${esc(z.address||'')} · ${esc(z.city||'')}</div><button class="light" onclick="showSite('${esc(z.id)}')">Voir la résidence</button></section>`).join('')}
function showSite(id){let x=vault.sites.find(z=>z.id===id);if(!x)return show('sites');let qs=vault.quotes.filter(z=>z.siteId===id);el.innerHTML=`<button class="light" onclick="show('sites')">← Résidences</button><section><h2>${esc(x.name)}</h2><p>${esc(x.address||'Adresse non renseignée')} · ${esc(x.city||'')}</p><p>Site : ${esc(x.id)}</p><p>Syndic : ${esc(syndicName(x.syndicId))}</p><p>Gestionnaire : ${esc(x.gestionnaire||'Non renseigné')}</p></section><h3>Devis rattachés (${qs.length})</h3>`+qs.map(q=>`<section><b>${esc(q.ref)}</b> — ${esc(q.name)}<div class="muted">${money(q.amount)} · ${esc(q.status)}</div></section>`).join('')+'<h3>Relances associées</h3>'+vault.reminders.filter(r=>r.siteId===id).map(r=>`<section><b>${esc(r.title)}</b><div class="muted">${esc(r.date)} · ${esc(r.quoteRef||'')}</div></section>`).join('')+'<h3>Documents PDF ('+vault.documents.filter(d=>d.siteId===id).length+')</h3>'+vault.documents.filter(d=>d.siteId===id).map(d=>`<section><b>${esc(d.name)}</b><div class="muted">${esc(d.category)}</div><button class="light" onclick="openPDF('${esc(d.id)}')">Ouvrir le PDF</button></section>`).join('')}
async function addSyndic(e){e.preventDefault();let name=$('sn').value.trim();if(!name)return;vault.syndics.push({id:'SY-'+uid(),name,contact:$('sc').value.trim(),phone:$('sp').value.trim(),email:$('se').value.trim()});await saveAndShow('syndics')}
async function addSite(e){e.preventDefault();let id=$('rid').value.trim(),name=$('rn').value.trim();if(!id||!name)return;if(vault.sites.some(x=>x.id===id))return alert('Ce numéro de site existe déjà.');vault.sites.push({id,name,address:$('ra').value.trim(),city:$('rc').value.trim(),syndicId:$('rs').value,gestionnaire:$('rg').value.trim(),devis:0,contrat:0});await saveAndShow('sites')}
function editSyndic(id){let x=vault.syndics.find(z=>z.id===id);if(!x)return;el.innerHTML=`<h2>Modifier le syndic</h2><section><form onsubmit="updateSyndic(event,'${esc(id)}')"><label>Nom<input id="en" required maxlength="100" value="${esc(x.name)}"></label><label>Interlocuteur<input id="ec" maxlength="100" value="${esc(x.contact)}"></label><label>Téléphone<input id="ep" maxlength="40" value="${esc(x.phone)}"></label><label>E-mail<input id="ee" type="email" maxlength="160" value="${esc(x.email)}"></label><button type="submit">Enregistrer</button><button type="button" class="light" onclick="show('syndics')">Annuler</button></form></section>`}
async function updateSyndic(e,id){e.preventDefault();let x=vault.syndics.find(z=>z.id===id);if(!x)return;x.name=$('en').value.trim();x.contact=$('ec').value.trim();x.phone=$('ep').value.trim();x.email=$('ee').value.trim();await saveAndShow('syndics')}
function editSite(id){let x=vault.sites.find(z=>z.id===id);if(!x)return;el.innerHTML=`<h2>Modifier la résidence</h2><section><form onsubmit="updateSite(event,'${esc(id)}')"><p class="muted">Numéro de site : ${esc(x.id)} (non modifiable)</p><label>Nom<input id="en" required maxlength="120" value="${esc(x.name)}"></label><label>Adresse<input id="ea" maxlength="160" value="${esc(x.address)}"></label><label>Ville<input id="ec" maxlength="100" value="${esc(x.city)}"></label><label>Gestionnaire<input id="eg" maxlength="100" value="${esc(x.gestionnaire||'')}"></label><label>Syndic<select id="es">${syndicOptions(x.syndicId)}</select></label><button type="submit">Enregistrer</button><button type="button" class="light" onclick="show('sites')">Annuler</button></form></section>`}
async function updateSite(e,id){e.preventDefault();let x=vault.sites.find(z=>z.id===id);if(!x)return;x.name=$('en').value.trim();x.address=$('ea').value.trim();x.city=$('ec').value.trim();x.syndicId=$('es').value;x.gestionnaire=$('eg').value.trim();await saveAndShow('sites')}
async function setStatus(i,value){vault.quotes[i].status=value;await saveAndShow('devis')}
async function addQuote(e){e.preventDefault();let ref=$('qref').value.trim(),name=$('qname').value.trim(),siteId=$('qsite').value,amount=Number($('qamount').value),date=$('qdate').value,status=$('qstatus').value;if(!ref||!name||!siteId||!Number.isFinite(amount)||amount<0)return alert('Vérifie les champs du devis.');if(vault.quotes.some(q=>q.ref.toLowerCase()===ref.toLowerCase()))return alert('Ce numéro de devis existe déjà.');vault.quotes.push({ref,name,siteId,amount,date,status});await saveAndShow('devis')}
function remindQuote(i){let q=vault.quotes[i];if(!q)return;show('relances');$('title').value='Relancer le devis '+q.ref;$('rsite').value=q.siteId||'';$('rquote').value=q.ref}
async function addReminder(e){if(e)e.preventDefault();let title=$('title').value.trim(),date=$('date').value,siteId=$('rsite').value,quoteRef=$('rquote').value;if(!title||!date)return alert('Indique un objet et une date');vault.reminders.push({title,date,siteId,quoteRef});await saveAndShow('relances')}
async function removeReminder(i){vault.reminders.splice(i,1);await saveAndShow('relances')}
const MAX_PDF=Math.floor(1.5*1024*1024),MAX_ALL=3*1024*1024;
let stagedPDFs=[];
function docOptions(selected=''){return vault.sites.map(x=>`<option value="${esc(x.id)}" ${selected===x.id?'selected':''}>${esc(x.name)} — ${esc(x.id)}</option>`).join('')}
async function preparePDFs(event){
 stagedPDFs=[];let files=Array.from(event.target.files||[]),errors=[];
 for(let file of files){
  if(file.size>MAX_PDF){errors.push(file.name+' : plus de 1,5 Mo');continue}
  let bytes=new Uint8Array(await file.arrayBuffer());
  if(bytes.length<5||String.fromCharCode(...bytes.slice(0,5))!=='%PDF-'){errors.push(file.name+' : pas un PDF reconnu');continue}
  let parts=[];for(let i=0;i<bytes.length;i+=16384)parts.push(String.fromCharCode(...bytes.subarray(i,i+16384)));
  stagedPDFs.push({id:uid(),name:file.name.slice(0,160),size:file.size,data:btoa(parts.join(''))});
 }
 let box=$('pdfDrafts');box.innerHTML=stagedPDFs.map((f,i)=>`<section><b>${esc(f.name)}</b><label>Résidence<select id="pdfr${i}"><option value="">Choisir une résidence</option>${docOptions()}</select></label><label>Catégorie<select id="pdfc${i}">${['Devis','Contrat de maintenance','Rapport','Courrier','Autre'].map(c=>`<option>${c}</option>`).join('')}</select></label></section>`).join('')+(stagedPDFs.length?'<button onclick="savePDFs()">Enregistrer les PDF sélectionnés</button>':'');
 if(errors.length)alert(errors.join('\n'));
}
async function savePDFs(){
 if(!stagedPDFs.length)return;
 let existing=vault.documents.reduce((n,d)=>n+d.size,0),incoming=stagedPDFs.reduce((n,d)=>n+d.size,0);
 if(existing+incoming>MAX_ALL)return alert('Limite de 3 Mo atteinte. Réduis le nombre ou la taille des PDF.');
 let additions=[];
 for(let i=0;i<stagedPDFs.length;i++){
  let siteId=$('pdfr'+i).value,category=$('pdfc'+i).value;
  if(!siteId)return alert('Choisis une résidence pour chaque PDF.');
  let f=stagedPDFs[i];
  if(vault.documents.some(d=>d.siteId===siteId&&d.data===f.data))return alert('Document déjà présent dans cette résidence : '+f.name);
  additions.push({...f,siteId,category});
 }
 vault.documents.push(...additions);
 try{await persist();stagedPDFs=[];show('documents');alert('PDF enregistrés dans le coffre chiffré.')}catch(e){vault.documents.splice(-additions.length,additions.length);alert('Enregistrement du PDF impossible : '+(e?.message||'erreur de stockage')+'. Aucun nouveau PDF enregistré.')}
}
function filterDocs(q){q=q.toLocaleLowerCase('fr');document.querySelectorAll('[data-doc-card]').forEach(e=>e.hidden=!e.dataset.search.includes(q))}
function openPDF(id){let d=vault.documents.find(x=>x.id===id);if(!d)return;try{let bin=atob(d.data),bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);let url=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));let a=document.createElement('a');a.href=url;a.download=d.name;a.click();setTimeout(()=>URL.revokeObjectURL(url),60000);alert('Le PDF est exporté hors du coffre : conserve-le dans un emplacement sûr.')}catch(e){alert('Ouverture impossible')}}
async function movePDF(id){let d=vault.documents.find(x=>x.id===id);if(!d)return;let site=prompt('Numéro de site de destination :',d.siteId);if(site===null)return;if(!vault.sites.some(s=>s.id===site))return alert('Numéro de site inconnu');let old=d.siteId;d.siteId=site;try{await persist();show('documents')}catch(e){d.siteId=old;alert('Enregistrement impossible')}}
async function deletePDF(id){if(!confirm('Supprimer ce document du coffre ?'))return;let index=vault.documents.findIndex(x=>x.id===id);if(index<0)return;let d=vault.documents.splice(index,1)[0];try{await persist();show('documents')}catch(e){vault.documents.splice(index,0,d);alert('Suppression non enregistrée')}}
async function exportBackup(){try{let pkg=await seal(vault,passphrase);let blob=new Blob([JSON.stringify(pkg,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='assistant-incendie-v3-4-2-sauvegarde-chiffree-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}catch(e){alert('Export impossible')}}
async function importBackup(event){let file=event.target.files?.[0];if(!file)return;try{if(file.size>8000000)throw Error('Fichier trop volumineux');let pkg=JSON.parse(await file.text());let imported=migrate(await openSeal(pkg,passphrase));if(!confirm('Remplacer toutes les modifications locales par cette sauvegarde ?'))return;vault=imported;await persist();show('home');alert('Sauvegarde restaurée.')}catch(e){alert('Restauration impossible : vérifie le fichier et sa phrase secrète.')}finally{event.target.value=''}}
if(!window.crypto?.subtle){el.innerHTML='<section>Ce navigateur ne permet pas le chiffrement. Ouvre l’application depuis son adresse HTTPS dans Safari.</section>'}else{renderLock();if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{})}

</script></body></html>
