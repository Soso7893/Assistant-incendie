 'use strict';

const encoder=new TextEncoder(),decoder=new TextDecoder();

const keyName='assistant-incendie-v2-encrypted'; // coffre de l’application principale conservé
// Coffre chiffré conservé en IndexedDB (quota mieux adapté aux PDF).
// L'ancien localStorage est conservé intact comme copie de secours V3.4.1.
const dbName='assistant-incendie-v342', storeName='vault';
function openDb(){return new Promise((resolve,reject)=>{const r=indexedDB.open(dbName,1);r.onupgradeneeded=()=>r.result.createObjectStore(storeName);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function readIdb(){const db=await openDb();try{return await new Promise((resolve,reject)=>{const tx=db.transaction(storeName,'readonly'),r=tx.objectStore(storeName).get('encrypted');r.onsuccess=()=>resolve(r.result||null);r.onerror=()=>reject(r.error)})}finally{db.close()}}
async function writeIdb(value){const db=await openDb();try{await new Promise((resolve,reject)=>{const tx=db.transaction(storeName,'readwrite');tx.objectStore(storeName).put(value,'encrypted');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error)})}finally{db.close()}}
let activeStore='legacy';
let revision=0;
function stamp(d){d._savedAt=Date.now();d._revision=(Number(d._revision)||0)+1;return d}
async function readCandidates(pass){let candidates=[];for(let [name,value] of [['idb',await readIdb().catch(()=>null)],['legacy',localStorage.getItem(keyName)]]){if(!value)continue;try{let data=migrate(await openSeal(JSON.parse(value),pass));candidates.push({name,value,data})}catch(e){candidates.push({name,value,error:e})}}return candidates}
function chooseCandidate(items){let valid=items.filter(x=>x.data);valid.sort((a,b)=>(Number(b.data._savedAt)||0)-(Number(a.data._savedAt)||0)||((b.data.sites?.length||0)-(a.data.sites?.length||0)));return valid[0]||null}


const money=n=>Number(n||0).toLocaleString('fr-FR',{style:'currency',currency:'EUR'});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Encodage d'un argument JavaScript dans un attribut HTML (évite l'injection via IDs).
const jsArg=value=>esc(JSON.stringify(String(value??'')));
const b64=a=>{const bytes=new Uint8Array(a),parts=[];for(let i=0;i<bytes.length;i+=8192)parts.push(String.fromCharCode(...bytes.subarray(i,i+8192)));return btoa(parts.join(''))};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const random=n=>crypto.getRandomValues(new Uint8Array(n));
const uid=()=>Array.from(random(12),n=>n.toString(16).padStart(2,'0')).join('');
async function derive(pass,salt){let base=await crypto.subtle.importKey('raw',encoder.encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:310000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function seal(data,pass){let salt=random(16),iv=random(12),key=await derive(pass,salt);let ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,encoder.encode(JSON.stringify(data)));return {format:'assistant-incendie-v2',version:2,kdf:'PBKDF2-SHA256',iterations:310000,salt:b64(salt),iv:b64(iv),ciphertext:b64(ct)}}
async function openSeal(pkg,pass){if(pkg?.format!=='assistant-incendie-v2'||pkg.version!==2||pkg.iterations!==310000)throw Error('Format non reconnu');let key=await derive(pass,unb64(pkg.salt));let data=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(pkg.iv)},key,unb64(pkg.ciphertext));let result=validateVaultShape(JSON.parse(decoder.decode(data)));return result}
function validateVaultShape(d){
 if(!d||typeof d!=='object'||Array.isArray(d))throw Error('Structure invalide');
 for(const key of ['quotes','reminders'])if(!Array.isArray(d[key])||d[key].length>100000)throw Error('Tableau invalide : '+key);
 for(const key of ['syndics','sites','documents','maintenanceVisits'])if(d[key]!==undefined&&(!Array.isArray(d[key])||d[key].length>100000))throw Error('Tableau invalide : '+key);
 if(d.contracts!==undefined&&(!d.contracts||typeof d.contracts!=='object'||Array.isArray(d.contracts)))throw Error('Contrats invalides');
 return d;
}
function migrate(d){if(!Array.isArray(d.maintenanceVisits))d.maintenanceVisits=[];if(!Array.isArray(d.syndics))d.syndics=structuredClone(defaultSyndics);if(!Array.isArray(d.sites))d.sites=structuredClone(defaultSites);if(!Array.isArray(d.documents))d.documents=[];if(!d.contracts||typeof d.contracts!=='object'||Array.isArray(d.contracts))d.contracts={};for(const q of d.quotes){if(!('siteId' in q))q.siteId=''}return d}
// Chaque écriture est sérialisée pour éviter qu'un chiffrement plus lent écrase une modification récente.
let writeQueue=Promise.resolve(),lastStoredValue=null,externalChange=false;
window.addEventListener('storage',e=>{if(e.key===keyName&&unlocked&&activeStore==='legacy'&&e.newValue!==lastStoredValue){externalChange=true;alert('Le coffre a changé dans un autre onglet. Ne modifie rien ici : exporte une sauvegarde puis rouvre une seule fenêtre.')}});
async function persist(){
 if(!unlocked)throw Error('Coffre verrouillé');
 const snapshot=stamp(structuredClone(vault)),secret=passphrase;
 const operation=writeQueue.catch(()=>{}).then(async()=>{
  if(externalChange)throw Error('Autre onglet détecté');
  const pkg=await seal(snapshot,secret),value=JSON.stringify(pkg);
  await writeIdb(value);
  const stored=await readIdb();
  if(stored!==value)throw Error('Écriture IndexedDB non conservée');
  const checked=await openSeal(JSON.parse(stored),secret);
  if(JSON.stringify(checked)!==JSON.stringify(snapshot))throw Error('Vérification échouée');
  activeStore='idb';lastStoredValue=value;
 });
 writeQueue=operation;
 return operation;
}

async function renderLock(){let idbValue=null;try{idbValue=await readIdb()}catch(e){}let exists=!!(idbValue||localStorage.getItem(keyName));el.innerHTML=`<section class="lock"><h2>🔐 ${exists?'Déverrouiller':'Créer un coffre chiffré'}</h2><p class="small">Application principale V3.8.3. Utilise ta phrase secrète habituelle pour retrouver son coffre. Les données de la version test peuvent ensuite être ajoutées depuis leur sauvegarde chiffrée.</p><label>Phrase secrète<input type="password" id="pass" autocomplete="off" placeholder="Au moins 12 caractères"></label>${exists?'':`<label>Confirmer la phrase secrète<input type="password" id="confirm" autocomplete="off"></label>`}<button id="unlock">${exists?'Déverrouiller':'Créer mon coffre'}</button><p id="error" class="danger"></p><p class="notice"><b>Attention :</b> sans la phrase secrète, les données sont irrécupérables. Sauvegarde régulièrement. Cette démo n’est pas auditée et ne doit pas recevoir de données professionnelles réelles.</p></section>`;$('unlock').onclick=async()=>{let pass=$('pass').value,err=$('error');err.textContent='';if(pass.length<12){err.textContent='Phrase secrète de 12 caractères minimum.';return}if(!exists&&pass!==$('confirm').value){err.textContent='Les deux phrases ne correspondent pas.';return}let btn=$('unlock');btn.disabled=true;try{let candidates=exists?await readCandidates(pass):[],selected=chooseCandidate(candidates);if(exists&&!selected)throw Error('Aucun coffre déchiffrable');let source=selected?.value||null;let data=selected?.data||demo();vault=migrate(data);passphrase=pass;unlocked=true;lastStoredValue=source;activeStore=selected?.name||'legacy';externalChange=false;if(!idbValue||selected?.name==='legacy')await persist();$('nav').classList.remove('hidden');show('home')}catch(e){err.textContent='Phrase incorrecte ou sauvegarde illisible.'}finally{btn.disabled=false}}}

function show(page){if(!unlocked)return renderLock();current=page;let s='';
if(page==='home'){let total=vault.quotes.reduce((n,q)=>n+Number(q.amount||0),0);s=`<div class="home-title"><span class="shield" aria-hidden="true">ϟ</span><div><h2>Assistant Incendie</h2><div class="muted">Suivi commercial · V3.8.3</div></div></div><div class="quick-grid"><button class="quick" onclick="show('sites')"><span>⌂</span>Résidences</button><button class="quick" onclick="show('syndics')"><span>▦</span>Syndics</button><button class="quick green" onclick="show('devis')"><span>▤</span>Devis</button><button class="quick red" onclick="showContracts()"><span>☑</span>Contrats</button><button class="quick orange" onclick="show('relances')"><span>▣</span>Relances</button><button class="quick green" onclick="show('documents')"><span>▧</span>Documents</button></div><input class="search-home" type="search" aria-label="Rechercher une résidence ou un syndic" placeholder="Rechercher un syndic, une résidence, un site…" oninput="filterHome(this.value)"><div class="actions"><button onclick="show('ca')">CA par syndic</button><button class="light" onclick="show('planning')">À relancer / À planifier</button></div><div class="recent-head"><h2>Dossiers récents</h2><button onclick="show('sites')">Voir tout</button></div><div id="recentSites">${homeSites('')}</div><button class="import-cta" onclick="show('documents')">＋ Importer un PDF<small>Analyse et classement par syndic et résidence</small></button><section><h2>🔒 Coffre et sauvegardes</h2><div class="actions"><button onclick="$('mergeTestBackup').click()">Importer les données de la version test</button><button class="light" onclick="restoreBeforeMerge()">Revenir à la sauvegarde avant fusion</button></div><input class="hidden" type="file" id="mergeTestBackup" accept=".json,application/json" onchange="prepareTestMerge(event)"><p class="small">La fusion conserve les données de cette application et ajoute les nouvelles fiches. Le suivi déjà présent dans la principale reste prioritaire.</p><div class="actions"><button onclick="expor function filterSites(value){const query=value.trim().toLocaleLowerCase('fr').normalize('NFD').replace(/[\u0300-\u036f]/g,'');let visible=0;document.querySelectorAll('[data-site-card]').forEach(card=>{const hay=(card.dataset.search||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'');const match=hay.includes(query);card.hidden=!match;if(match)visible++});let counter=$('siteSearchCount');if(counter)counter.textContent=visible+' résidence(s) trouvée(s)'}

 const x=vault.sites.find(z=>z.id===id);if(!x)return show('sites');

const EQUIPMENT=['Extincteurs','BAES','Désenfumage escalier','Colonnes sèches','Désenfumage des circulations','Ferme-portes','Ventilation parking','VMC','Pompes de relevage','Portes coupe-feu','Alarme incendie'];
const EQUIPMENT_PATTERNS=[/extincteur/i,/\bbaes\b|eclairage de securite/i,/desenfumage.{0,25}escalier|escalier.{0,25}desenfumage/i,/colonne.{0,12}seche/i,/desenfumage.{0,25}circulation|circulation.{0,25}desenfumage/i,/ferme[ -]?porte/i,/ventilation.{0,20}parking|parking.{0,20}ventilation/i,/\bvmc\b|ventilation mecanique controlee/i,/pompe.{0,20}relevage/i,/porte.{0,15}coupe[ -]?feu/i,/alarme.{0,15}incendie|\bssi\b|\bbaas\b/i];
function equipmentFromLegacy(c){if(Array.isArray(c?.equipmentItems))return c.equipmentItems.filter(x=>EQUIPMENT.includes(x));const raw=normalized(c?.equipment||'');return EQUIPMENT.filter((x,i)=>EQUIPMENT_PATTERNS[i].test(raw))}
function contractCard(siteId){const c=vault.contracts?.[siteId];const docs=vault.documents.filter(d=>d.siteId===siteId&&d.category==='Contrat de maintenance');const items=c?equipmentFromLegacy(c):[];const prices=c?.equipmentPrices||{};return `<section><div class="muted">Un seul contrat global par résidence · les montants proposés ne prouvent pas une acceptation</div>${c?`<p><b>${esc(c.number||'Sans numéro')}</b> · ${money(c.amount)} HT/an</p><p>${items.length?items.map(x=>esc(x)).join(', '):esc(c.equipment||'Équipements non renseignés')}</p>${items.filter(x=>prices[x]!==''&&prices[x]!=null).map(x=>`<div class="row"><span>${esc(x)}</span><b>${money(prices[x])} HT/an</b></div>`).join('')}<p>Du ${esc(c.start||'—')} au ${esc(c.end||'—')} · ${esc(c.status||'')}</p>`:'<p>Aucun contrat renseigné.</p>'}${docs.length?`<p class="small">PDF de contrat associés : ${docs.map(d=>esc(d.name)).join(' · ')}</p>${docs.filter(d=>d.contractProposal?.items?.length).map(d=>`<button class="light" onclick="reviewContractProposal(${jsArg(d.id)})">Vérifier la proposition du PDF : ${esc(d.name)}</button>`).join('')}`:''}<button class="light" onclick="editContract(${jsArg(siteId)})">${c?'Modifier':'Ajouter'} le contrat global</button></section>`}
function reviewContractProposal(docId){const d=vault.documents.find(x=>x.id===docId);if(!d||!d.contractProposal)return;const proposal=d.contractProposal,old=vault.contracts[d.siteId]||{};if(!confirm('Préremplir le formulaire du contrat avec les équipements détectés dans ce PDF fictif ? Tu vérifieras les informations avant tout enregistrement.'))return;editContract(d.siteId);for(let i=0;i<EQUIPMENT.length;i++){const selected=false;$('eq'+i).checked=selected;$('ep'+i).disabled=true;$('ep'+i).value=proposal.prices[EQUIPMENT[i]]!=null?proposal.prices[EQUIPMENT[i]]:''}if(d.detectedReference&&!old.number&&d.detectedReference!==d.siteId)$('cn').value=d.detectedReference;alert('Prestations proposées détectées. Coche uniquement les prestations réellement retenues, puis vérifie les montants et le total avant d’enregistrer. Aucun contrat n’a encore été sauvegardé.')}
function editContract(siteId){const x=vault.sites.find(z=>z.id===siteId);if(!x)return;const c=vault.contracts?.[siteId]||{},selected=equipmentFromLegacy(c),prices=c.equipmentPrices||{};el.innerHTML=`<button class="light" onclick="showSite(${jsArg(siteId)})">← Résidence</button><section><h2>Contrat global · ${esc(x.name)}</h2><form onsubmit="saveContract(event,${jsArg(siteId)})"><label>Numéro de contrat<input id="cn" maxlength="70" value="${esc(c.number||'')}"></label><label>Montant annuel HT global (€)<input id="ca" type="number" min="0" step="0.01" value="${esc(c.amount??'')}"></label><h3>Équipements couverts et montants annuels HT</h3><p class="small">Coche les équipements réellement inclus. Les montants par équipement sont facultatifs si le PDF indique seulement un total.</p>${EQUIPMENT.map((item,i)=>`<div class="row" style="align-items:flex-end"><label style="flex:2"><input type="checkbox" id="eq${i}" ${selected.includes(item)?'checked':''} style="width:auto" onchange="toggleEquipment(${i})"> ${esc(item)}</label><label style="flex:1;font-size:12px">HT/an (€)<input type="number" id="ep${i}" min="0" step="0.01" ${selected.includes(item)?'':'disabled'} value="${esc(prices[item]??'')}" placeholder="—"></label></div>`).join('')}<button type="button" class="light" onclick="sumContractPrices()">Calculer le total des lignes renseignées</button><p id="contractSum" class="small"></p><label>Date de début<input id="cs" type="date" value="${esc(c.start||'')}"></label><label>Date d'échéance<input id="cd" type="date" value="${esc(c.end||'')}"></label><label>Statut<select id="ct">${['À proposer','Envoyé','Signé','En cours','Résilié'].map(v=>`<option ${c.status===v?'selected':''}>${v}</option>`).join('')}</select></label><p class="small">Les PDF classés « Contrat de maintenance » pour cette résidence restent accessibles dans sa fiche. Une proposition issue d'un PDF doit toujours être vérifiée.</p><button type="submit">Enregistrer le contrat</button></form></section>`}
function toggleEquipment(i){$('ep'+i).disabled=!$('eq'+i).checked;if(!$('eq'+i).checked)$('ep'+i).value=''}
function sumContractPrices(){let total=0,count=0;EQUIPMENT.forEach((_,i)=>{if($('eq'+i).checked&&$('ep'+i).value!==''){total+=Number($('ep'+i).value);count++}});$('contractSum').textContent=count?`Somme des ${count} lignes renseignées : ${money(total)} HT/an. Vérifie avant d'appliquer.`:'Aucun montant détaillé renseigné.';if(count&&confirm('Reporter cette somme dans le montant global ?'))$('ca').value=total.toFixed(2)}
async function saveContract(e,siteId){e.preventDefault();const acceptance=$('contractAcceptedDate')?.value||'';if(['Signé','En cours'].includes($('ct').value)&&(!acceptance||acceptance>todayLocal()))return alert('Indique la date réelle d’acceptation du contrat.');const amount=$('ca').value;if(amount!==''&&(!Number.isFinite(Number(amount))||Number(amount)<0))return alert('Montant incorrect');let items=[],prices={};for(let i=0;i<EQUIPMENT.length;i++){if(!$('eq'+i).checked)continue;items.push(EQUIPMENT[i]);let v=$('ep'+i).value;if(v!==''){if(!Number.isFinite(Number(v))||Number(v)<0)return alert('Montant incorrect pour '+EQUIPMENT[i]);prices[EQUIPMENT[i]]=Number(v)}}const old=vault.contracts[siteId],oldContractReminders=structuredClone(vault.reminders);vault.contracts[siteId]={...old,number:$('cn').value.trim(),amount:amount===''?null:Number(amount),equipment:items.join(', '),equipmentItems:items,equipmentPrices:prices,start:$('cs').value,end:$('cd').value,status:$('ct').value,acceptedDate:acceptance};reconcilePlanningReminders();try{await persist();showSite(siteId);alert('Contrat enregistré et vérifié.')}catch(err){if(old===undefined)delete vault.contracts[siteId];else vault.contracts[siteId]=old;vault.reminders=oldContractReminders;alert('Échec de sauvegarde : '+(err?.message||'erreur'))}}

function editSyndic(id){let x=vault.syndics.find(z=>z.id===id);if(!x)return;el.innerHTML=`<h2>Modifier le syndic</h2><section><form onsubmit="updateSyndic(event,${jsArg(id)})"><label>Nom<input id="en" required maxlength="100" value="${esc(x.name)}"></label><label>Interlocuteur<input id="ec" maxlength="100" value="${esc(x.contact)}"></label><label>Téléphone<input id="ep" maxlength="40" value="${esc(x.phone)}"></label><label>E-mail<input id="ee" type="email" maxlength="160" value="${esc(x.email)}"></label><button type="submit">Enregistrer</button><button type="button" class="light" onclick="show('syndics')">Annuler</button></form></section>`}

function parseDetectedEuro(raw){
 const str=String(raw||'').replace(/[\s\u00a0\u202f]/g,'').replace(/€/g,'');
 if(!str)return null;
 let v=str;
 if(v.includes(',')&&v.includes('.'))v=v.lastIndexOf(',')>v.lastIndexOf('.')?v.replace(/\./g,'').replace(',','.'):v.replace(/,/g,'');
 else if(v.includes(','))v=v.replace(',','.');
 else if(/^\d{1,3}(?:\.\d{3})+$/.test(v))v=v.replace(/\./g,'');
 const n=Number(v);return Number.isFinite(n)&&n>=0?n:null;
}

  const number=siteLine?.match(/\bSITE\s*N[°ºo]?\s*(\d+)/i)?.[1];if(number)f.number=number;
  const title=block.find(l=>/^(?:SDC|R[EÉ]SIDENCE|COPROPRI[EÉ]T[EÉ])\b/i.test(l));if(title)f.name=title.slice(0,120);
  const syn=block.join('\n').match(/\b(CABINET\s+[^\n]+|SYNDIC\s*:\s*[^\n]+)/i);if(syn)f.syndic=syn[1].replace(/^syndic\s*:\s*/i,'').trim().slice(0,100);

  const loc=block.find(l=>/^\d{5}\s+/.test(l)&&!/PARIS\b/i.test(l)&&!/\brue\b/i.test(l));if(loc)f.city=loc.replace(/\s+FR\s+FRANCE.*$/i,'').trim();
 }

function detectQuoteBundle(pages,name){

  const annex=/conditions\s+(?:particulieres|particulières|generales|générales)|objet\s+de\s+la\s+vente/i.test(text)&&!ref;
  if(annex){currentGroup=null;annexPages.push(index+1);return;}
  if(ref){if(!currentGroup||currentGroup.ref!==ref){currentGroup={ref,pages:[],texts:[]};groups.push(currentGroup);}currentGroup.pages.push(index+1);currentGroup.texts.push(text);}

 });

function extractQuoteLineItems(text){
 const lines=cleanQuoteText(text).split(/\r?\n/).map(l=>l.trim()).filter(Boolean),result=[];
 let active=false,category='Matériel',pending='';
 const decimal='[0-9]+(?:[ \\u00a0][0-9]{3})*(?:[,.][0-9]{2})';
 const pattern=new RegExp('^(.*?)\\s*([0-9]+(?:[,.][0-9]{1,3})?)\\s+('+decimal+')\\s+('+decimal+')(?:\\s+[0-9]+(?:[,.][0-9]+)?\\s*%?)?\\s*$');
 for(const line of lines){
  const n=normalized(line).trim();
  if(/designation.*quantite.*montant ht/.test(n)){active=true;pending='';continue;}
  if(!active)continue;
  if(/^(?:delais|delai |validite|informations|total ht|total h t|date d acceptation|conditions de reglement|fl protection incendie|sas au capital)/.test(n)){active=false;pending='';continue;}
  if(n==='materiel'||n==='materiels'){category='Matériel';pending='';continue;}
  if(/^deplacement et main d oeuvre/.test(n)){category='Main-d’œuvre';pending='';continue;}
  const m=line.match(pattern);
  if(m){
   const label=(m[1].trim()||pending).trim(),quantity=parseDetectedEuro(m[2]),unitPrice=parseDetectedEuro(m[3]),amount=parseDetectedEuro(m[4]);
   if(!label||quantity===null||unitPrice===null||amount===null){pending='';continue;}
   result.push({label,quantity,unitPrice,amount,category:/^(?:frais|deplacement zone|vacation)\b/i.test(label)?'Frais':category,consistent:Math.abs(quantity*unitPrice-amount)<=0.02});pending='';
  }else if(/^code de l environnement/i.test(n)&&result.length){result.at(-1).label+=' · '+line;}
  else if(!/^page\b/.test(n))pending=(pending+' '+line).trim().slice(0,240);
 }
 return result;
}

 for(const syn of source.syndics){

  if(!syn.id||!String(syn.name||'').trim()){errors.push('Un syndic importé n’a pas de nom ou d’identifiant.');continue;}
  let target=result.syndics.find(s=>companyKey(s.name)===companyKey(syn.name));
  if(!target){target=copy(syn);if(result.syndics.some(s=>s.id===target.id))target.id='SY-'+uid();result.syndics.push(target);counts.syndics++;}
  else for(const field of ['contact','phone','email'])if(!target[field]&&syn[field])target[field]=syn[field];
  synMap.set(syn.id,target.id);
 }
 for(const site of sites){
  if(!site.id||!site.name||['__proto__','constructor','prototype'].includes(String(site.id).toLowerCase())){errors.push('Une résidence importée n’a pas de nom ou de numéro.');continue;}
  const synId=synMap.get(site.syndicId)||'',target=result.sites.find(s=>canonical(s.id)===canonical(site.id));
  if(target){
   if(target.syndicId&&synId&&target.syndicId!==synId)errors.push('Site '+site.id+' : syndics différents. Corrige le rattachement avant la fusion.');
   if(target.address&&site.address&&addressKey(target.address)!==addressKey(site.address))errors.push('Site '+site.id+' : adresses différentes. Vérifie les deux fiches avant la fusion.');
   for(const field of ['address','city','gestionnaire'])if(!target[field]&&site[field])target[field]=site[field];
   if(!target.syndicId)target.syndicId=synId;
   for(const name of siteManagerNames(site))attachManagerToSite(target,name);
   if(normalized(target.name)!==normalized(site.name))notes.push('Site '+site.id+' : nom de la principale conservé (« '+target.name+' »).');
   siteMap.set(site.id,target.id);
  }else{const added={...copy(site),syndicId:synId};result.sites.push(added);siteMap.set(site.id,added.id);addedSites.push(added);counts.sites++;}
 }
 const mappedSite=id=>siteMap.get(id)||result.sites.find(s=>canonical(s.id)===canonical(id))?.id||'';
 for(const doc of source.documents){
  if(excluded.has(doc.siteId)&&!(doc.siteIds||[]).some(id=>!excluded.has(id)))continue;
  if(!doc.id||!doc.data){errors.push('Un document importé est incomplet.');continue;}
  let target=result.documents.find(d=>d.data===doc.data);
  if(!target){target=copy(doc);if(result.documents.some(d=>d.id===target.id))target.id=uid();target.siteId=mappedSite(doc.siteId)||(doc.siteIds||[]).map(mappedSite).find(Boolean)||'';target.siteIds=Array.from(new Set([target.siteId,...(doc.siteIds||[]).map(mappedSite)].filter(Boolean)));result.documents.push(target);counts.documents++;}
  else{target.siteIds=Array.from(new Set([target.siteId,...(target.siteIds||[]),mappedSite(doc.siteId),...(doc.siteIds||[]).map(mappedSite)].filter(Boolean)));for(const field of ['contractProposal','detectedQuoteLines','photos','quoteReferences','annexPages'])if((target[field]==null||Array.isArray(target[field])&&!target[field].length)&&doc[field]!=null)target[field]=copy(doc[field]);}
  docMap.set(doc.id,target.id);
 }
 for(const site of addedSites)if(site.photoDocId)site.photoDocId=docMap.get(site.photoDocId)||'';
 for(const q of source.quotes){
  if(excluded.has(q.siteId))continue;
  const siteId=mappedSite(q.siteId);if(q.siteId&&!siteId){errors.push('Devis '+q.ref+' : résidence introuvable.');continue;}
  if(!q.ref){errors.push('Un devis importé n’a pas de référence.');continue;}
  const target=result.quotes.find(t=>canonical(t.ref)===canonical(q.ref));
  if(target){
   if(target.siteId&&siteId&&target.siteId!==siteId){errors.push('Devis '+q.ref+' déjà présent pour une autre résidence.');continue;}
   counts.existingQuotes++;
   if(!target.siteId)target.siteId=siteId;
   for(const field of ['lineItems','sourcePages'])if((!target[field]||!target[field].length)&&q[field])target[field]=copy(q[field]);
   if(!target.pdfDocId&&q.pdfDocId)target.pdfDocId=docMap.get(q.pdfDocId)||'';
   if(!target.gestionnaire&&q.gestionnaire)target.gestionnaire=q.gestionnaire;
   if(!target.acceptedDate&&commercialState(target)===commercialState(q)&&q.acceptedDate)target.acceptedDate=q.acceptedDate;
   if(commercialState(target)!==commercialState(q)||workState(target)!==workState(q))notes.push('Devis '+q.ref+' : état de la principale conservé.');
  }else{result.quotes.push({...copy(q),siteId,pdfDocId:docMap.get(q.pdfDocId)||''});counts.quotes++;}
 }
 for(const [oldId,contract] of Object.entries(source.contracts||{})){
  if(excluded.has(oldId))continue;const siteId=mappedSite(oldId);if(!siteId){errors.push('Contrat sans résidence reconnue : '+oldId);continue;}
  const target=result.contracts[siteId];
  if(target){counts.existingContracts++;for(const field of ['proposedItems','proposedPrices','proposedFees','proposedQuantities','otherProposedItems','extinguisherOptions'])if((!target[field]||Array.isArray(target[field])&&!target[field].length)&&contract[field])target[field]=copy(contract[field]);if(!target.acceptedDate&&target.status===contract.status&&contract.acceptedDate)target.acceptedDate=contract.acceptedDate;notes.push('Contrat du site '+siteId+' : sélection, montant et état de la principale conservés.');}
  else{result.contracts[siteId]={...copy(contract),sourceDocId:docMap.get(contract.sourceDocId)||''};counts.contracts++;}
 }
 if(!result.maintenanceVisits)result.maintenanceVisits=[];
 for(const v of source.maintenanceVisits||[]){
  if(excluded.has(v.siteId))continue;const siteId=mappedSite(v.siteId);if(!siteId){errors.push('Visite sans résidence reconnue.');continue;}
  let target=result.maintenanceVisits.find(t=>t.siteId===siteId&&t.dueDate===v.dueDate);
  if(!target){target={...copy(v),siteId};if(result.maintenanceVisits.some(t=>t.id===target.id))target.id=uid();result.maintenanceVisits.push(target);counts.visits++;}
  else if(target.status!==v.status)notes.push('Visite du site '+siteId+' ('+v.dueDate+') : état de la principale conservé.');
  visitMap.set(v.id,target.id);
 }
 for(const r of source.reminders){
  if(excluded.has(r.siteId))continue;const item={...copy(r),siteId:mappedSite(r.siteId)};
  if(item.planningKey){for(const [oldId,newId] of visitMap)for(const prefix of ['visit:','visit-overdue:'])if(item.planningKey===prefix+oldId)item.planningKey=prefix+newId;for(const [oldId,newId] of siteMap)if(item.planningKey.startsWith('contract:'+oldId+':'))item.planningKey=item.planningKey.replace('contract:'+oldId+':','contract:'+newId+':');}
  if(result.reminders.some(t=>t.title===item.title&&t.date===item.date&&t.siteId===item.siteId&&t.quoteRef===item.quoteRef||item.planningKey&&t.planningKey===item.planningKey))continue;
  result.reminders.push(item);counts.reminders++;
 }
 if(!result.planningSettings&&source.planningSettings){if([source.planningSettings.works,source.planningSettings.maintenance].every(v=>Number.isInteger(v)&&v>=0&&v<=365))result.planningSettings=copy(source.planningSettings);else errors.push('Délais de planification incorrects dans la sauvegarde.');}
 const usedBytes=result.documents.reduce((n,d)=>n+Number(d.size||0),0);if(usedBytes>MAX_ALL)errors.push('La fusion dépasserait la limite de documents du coffre. Exporte et libère de la place avant de recommencer.');
 return {vault:validateVaultShape(result),counts,errors:Array.from(new Set(errors)),notes:Array.from(new Set(notes))};
}
async function prepareTestMerge(event){
 const file=event.target.files?.[0];if(!file)return;
 try{if(file.size>8000000)throw Error('Sauvegarde trop volumineuse.');const pkg=JSON.parse(await file.text());let incoming;
  try{incoming=await openSeal(pkg,passphrase)}catch(e){const secret=prompt('Saisis la phrase secrète de la version test pour ouvrir sa sauvegarde. Elle reste sur cet appareil.');if(secret===null)return;incoming=await openSeal(pkg,secret);}
  testMergeDraft={incoming};renderTestMerge(true);
 }catch(e){alert('Sauvegarde test illisible : '+(e.message||'vérifie le fichier et sa phrase secrète.'));}finally{event.target.value='';}
}
function renderTestMerge(skipExamples=true){
 if(!testMergeDraft)return;const p=mergeVaultSnapshots(vault,testMergeDraft.incoming,skipExamples),c=p.counts;
 el.innerHTML=`<button class="light" onclick="testMergeDraft=null;show('home')">← Annuler</button><section><h2>Importer les données de la version test</h2><p>Les données de la principale sont conservées. Les nouvelles fiches sont ajoutées et les références déjà présentes sont réutilisées.</p><label><input type="checkbox" style="width:auto" id="skipMergeExamples" ${skipExamples?'checked':''} onchange="renderTestMerge(this.checked)"> Ignorer les deux résidences de démonstration</label><p class="small">${c.examplesSkipped} résidence(s) de démonstration ignorée(s).</p><ul><li>${c.syndics} nouveau(x) syndic(s)</li><li>${c.sites} nouvelle(s) résidence(s)</li><li>${c.quotes} nouveau(x) devis</li><li>${c.contracts} nouveau(x) contrat(s)</li><li>${c.documents} nouveau(x) PDF</li><li>${c.visits} visite(s) et ${c.reminders} relance(s)</li></ul><p>${c.existingQuotes} devis et ${c.existingContracts} contrats déjà présents : leur suivi principal reste prioritaire.</p>${p.notes.length?'<details><summary>Informations sur les fiches déjà présentes</summary><ul>'+p.notes.map(n=>'<li>'+esc(n)+'</li>').join('')+'</ul></details>':''}${p.errors.length?'<p class="notice">Fusion suspendue : corrige les points suivants.</p><ul>'+p.errors.map(e=>'<li>'+esc(e)+'</li>').join('')+'</ul>':''}<p class="small">Une copie chiffrée du coffre principal sera conservée localement avant la fusion.</p><div class="actions"><button class="light" onclick="exportBackup()">Exporter le coffre principal actuel</button><button ${p.errors.length?'disabled':''} onclick="applyTestMerge()">Fusionner ces données</button></div></section>`;
}
const mergeRecoveryKey='before-test-merge-v383';
async function saveMergeRecovery(before){
 const sealed=JSON.stringify(await seal(before,passphrase)),db=await openDb();
 try{await new Promise((resolve,reject)=>{const tx=db.transaction(storeName,'readwrite');tx.objectStore(storeName).put(sealed,mergeRecoveryKey);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error);});const stored=await new Promise((resolve,reject)=>{const tx=db.transaction(storeName,'readonly'),r=tx.objectStore(storeName).get(mergeRecoveryKey);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});if(stored!==sealed)throw Error('Copie avant fusion non vérifiée.');}finally{db.close();}
}
async function applyTestMerge(){
 if(!testMergeDraft)return;const plan=mergeVaultSnapshots(vault,testMergeDraft.incoming,$('skipMergeExamples').checked);if(plan.errors.length)return renderTestMerge($('skipMergeExamples').checked);
 const before=structuredClone(vault);try{await writeQueue;await saveMergeRecovery(before);vault=plan.vault;reconcilePlanningReminders();await persist();testMergeDraft=null;show('home');alert('Fusion enregistrée et vérifiée. Les fiches de la principale sont conservées.');}catch(e){vault=before;alert('Fusion non validée : '+(e.message||'erreur')+'. La copie avant fusion reste disponible si elle a pu être enregistrée.');}
}
async function restoreBeforeMerge(){
 try{const db=await openDb();let value;try{value=await new Promise((resolve,reject)=>{const tx=db.transaction(storeName,'readonly'),r=tx.objectStore(storeName).get(mergeRecoveryKey);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});}finally{db.close();}
  if(!value)return alert('Aucune sauvegarde avant fusion n’est disponible sur cet appareil.');const restored=migrate(await openSeal(JSON.parse(value),passphrase));
  if(!confirm('Revenir aux données du coffre principal juste avant la dernière fusion ? Les modifications faites depuis seront retirées.'))return;
  const before=vault;vault=restored;try{await persist();show('home');alert('Coffre avant fusion restauré.');}catch(e){vault=before;throw e;}
 }catch(e){alert('Restauration avant fusion impossible : '+(e.message||'erreur'));}
}

if(!window.crypto?.subtle){el.innerHTML='<section>Ce navigateur ne permet pas le chiffrement. Ouvre l’application depuis son adresse HTTPS dans Safari.</section>'}else{renderLock();if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{})}
