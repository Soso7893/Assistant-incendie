<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102b45"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Assistant Incendie"><link rel="manifest" href="manifest.webmanifest"><title>Assistant Incendie V3.6.9 — Démo</title><style>*{box-sizing:border-box}body{margin:0;background:#f2f5f9;color:#172a3b;font-family:-apple-system,BlinkMacSystemFont,system-ui}header{background:#102b45;color:white;padding:28px 18px}h1{font-size:23px;margin:0}header p{color:#b9d1e3;font-size:13px}main{padding:18px 16px 105px;max-width:600px;margin:auto}h2{font-size:20px}section{background:white;border-radius:15px;padding:16px;margin:12px 0;box-shadow:0 2px 12px #19324b0c}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:12px 0}.muted{font-size:12px;color:#6c7b89}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{border:0;border-radius:12px;background:#12649a;color:white;padding:13px 10px;font-size:14px;font-weight:600}button.light{background:#e8f0f6;color:#23415b}select,input{width:100%;padding:12px;border:1px solid #d4dfe9;border-radius:10px;background:white;font-size:15px}nav{position:fixed;bottom:0;background:white;left:0;right:0;display:flex;justify-content:space-around;border-top:1px solid #e3e8ee;padding:10px 4px max(12px,env(safe-area-inset-bottom))}nav button{font-size:12px;background:white;color:#183b55;padding:8px}.tag{font-size:12px;background:#e9f5e9;border-radius:7px;padding:5px 8px}.notice{background:#fff3db;border-radius:10px;padding:12px;font-size:13px}b{font-weight:700}
.lock{max-width:460px;margin:22px auto}.danger{color:#8d2424}.small{font-size:12px;color:#576675}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1}.tag{font-size:12px;background:#e7f1fa;padding:5px 9px;border-radius:8px}.hidden{display:none!important}input[type=password]{width:100%;padding:13px;border:1px solid #aab9c7;border-radius:9px;margin:8px 0 14px}button:disabled{opacity:.55} .notice{line-height:1.5}</style></head><body><header><h1>🛡️ Assistant Incendie</h1><p>V3.6.9 — devis et contrats PDF · COFFRE ISOLÉ · données fictives uniquement</p></header><main id="app"></main><nav id="nav" class="hidden"><button onclick="show('home')">⌂ Accueil</button><button onclick="show('syndics')">▤ Syndics</button><button onclick="show('devis')">▣ Devis</button><button onclick="show('relances')">◷ Relances</button><button onclick="show('exports')">⇩ Exports</button></nav><script>
 'use strict';
const $=id=>document.getElementById(id),el=$('app');
const encoder=new TextEncoder(),decoder=new TextDecoder();
const demo=()=>({quotes:[{ref:'DEMO-D001',name:'Vérification extincteurs',amount:450,status:'À confirmer',siteId:'DEMO-001'},{ref:'DEMO-D002',name:'Éclairage de sécurité',amount:1000,status:'À confirmer',siteId:'DEMO-002'}],reminders:[],syndics:[{id:'SY-DEMO-1',name:'Syndic Exemple',contact:'Camille Martin',phone:'',email:''}],sites:[{id:'DEMO-001',name:'Résidence Démonstration A',city:'Ville Exemple',address:'1 rue Exemple',syndicId:'SY-DEMO-1',devis:1450,contrat:680},{id:'DEMO-002',name:'Résidence Démonstration B',city:'Ville Exemple',address:'2 rue Exemple',syndicId:'SY-DEMO-1',devis:720,contrat:320}]});
const defaultSyndics=demo().syndics,defaultSites=demo().sites;
let vault=null,passphrase=null,unlocked=false,current='home';
const keyName='assistant-incendie-TEST-v368-local'; // espace strictement réservé aux tests
// Coffre chiffré conservé en IndexedDB (quota mieux adapté aux PDF).
// L'ancien localStorage est conservé intact comme copie de secours V3.4.1.
const dbName='assistant-incendie-TEST-v368', storeName='vault';
function openDb(){return new Promise((resolve,reject)=>{const r=indexedDB.open(dbName,1);r.onupgradeneeded=()=>r.result.createObjectStore(storeName);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function readIdb(){const db=await openDb();try{return await new Promise((resolve,reject)=>{const tx=db.transaction(storeName,'readonly'),r=tx.objectStore(storeName).get('encrypted');r.onsuccess=()=>resolve(r.result||null);r.onerror=()=>reject(r.error)})}finally{db.close()}}
async function writeIdb(value){const db=await openDb();try{await new Promise((resolve,reject)=>{const tx=db.transaction(storeName,'readwrite');tx.objectStore(storeName).put(value,'encrypted');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error)})}finally{db.close()}}
let activeStore='legacy';
let revision=0;
function stamp(d){d._savedAt=Date.now();d._revision=(Number(d._revision)||0)+1;return d}
async function readCandidates(pass){let candidates=[];for(let [name,value] of [['idb',await readIdb().catch(()=>null)],['legacy',localStorage.getItem(keyName)]]){if(!value)continue;try{let data=migrate(await openSeal(JSON.parse(value),pass));candidates.push({name,value,data})}catch(e){candidates.push({name,value,error:e})}}return candidates}
function chooseCandidate(items){let valid=items.filter(x=>x.data);valid.sort((a,b)=>(Number(b.data._savedAt)||0)-(Number(a.data._savedAt)||0)||((b.data.sites?.length||0)-(a.data.sites?.length||0)));return valid[0]||null}


const money=n=>Number(n||0).toLocaleString('fr-FR',{style:'currency',currency:'EUR'});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Encodage d'un argument JavaScript dans un attribut HTML (évite l'injection via IDs).
const jsArg=value=>esc(JSON.stringify(String(value??'')));
const b64=a=>{const bytes=new Uint8Array(a),parts=[];for(let i=0;i<bytes.length;i+=8192)parts.push(String.fromCharCode(...bytes.subarray(i,i+8192)));return btoa(parts.join(''))};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const random=n=>crypto.getRandomValues(new Uint8Array(n));
const uid=()=>Array.from(random(12),n=>n.toString(16).padStart(2,'0')).join('');
async function derive(pass,salt){let base=await crypto.subtle.importKey('raw',encoder.encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:310000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function seal(data,pass){let salt=random(16),iv=random(12),key=await derive(pass,salt);let ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,encoder.encode(JSON.stringify(data)));return {format:'assistant-incendie-v2',version:2,kdf:'PBKDF2-SHA256',iterations:310000,salt:b64(salt),iv:b64(iv),ciphertext:b64(ct)}}
async function openSeal(pkg,pass){if(pkg?.format!=='assistant-incendie-v2'||pkg.version!==2||pkg.iterations!==310000)throw Error('Format non reconnu');let key=await derive(pass,unb64(pkg.salt));let data=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(pkg.iv)},key,unb64(pkg.ciphertext));let result=validateVaultShape(JSON.parse(decoder.decode(data)));return result}
function validateVaultShape(d){
 if(!d||typeof d!=='object'||Array.isArray(d))throw Error('Structure invalide');
 for(const key of ['quotes','reminders'])if(!Array.isArray(d[key])||d[key].length>100000)throw Error('Tableau invalide : '+key);
 for(const key of ['syndics','sites','documents'])if(d[key]!==undefined&&(!Array.isArray(d[key])||d[key].length>100000))throw Error('Tableau invalide : '+key);
 if(d.contracts!==undefined&&(!d.contracts||typeof d.contracts!=='object'||Array.isArray(d.contracts)))throw Error('Contrats invalides');
 return d;
}
function migrate(d){if(!Array.isArray(d.syndics))d.syndics=structuredClone(defaultSyndics);if(!Array.isArray(d.sites))d.sites=structuredClone(defaultSites);if(!Array.isArray(d.documents))d.documents=[];if(!d.contracts||typeof d.contracts!=='object'||Array.isArray(d.contracts))d.contracts={};for(const q of d.quotes){if(!('siteId' in q))q.siteId=''}return d}
// Chaque écriture est sérialisée pour éviter qu'un chiffrement plus lent écrase une modification récente.
let writeQueue=Promise.resolve(),lastStoredValue=null,externalChange=false;
window.addEventListener('storage',e=>{if(e.key===keyName&&unlocked&&activeStore==='legacy'&&e.newValue!==lastStoredValue){externalChange=true;alert('Le coffre a changé dans un autre onglet. Ne modifie rien ici : exporte une sauvegarde puis rouvre une seule fenêtre.')}});
async function persist(){
 if(!unlocked)throw Error('Coffre verrouillé');
 const snapshot=stamp(structuredClone(vault)),secret=passphrase;
 const operation=writeQueue.catch(()=>{}).then(async()=>{
  if(externalChange)throw Error('Autre onglet détecté');
  const pkg=await seal(snapshot,secret),value=JSON.stringify(pkg);
  await writeIdb(value);
  const stored=await readIdb();
  if(stored!==value)throw Error('Écriture IndexedDB non conservée');
  const checked=await openSeal(JSON.parse(stored),secret);
  if(JSON.stringify(checked)!==JSON.stringify(snapshot))throw Error('Vérification échouée');
  activeStore='idb';lastStoredValue=value;
 });
 writeQueue=operation;
 return operation;
}
async function saveAndShow(page){try{await persist();show(page);alert('Modification enregistrée et vérifiée sur cet appareil. Exporte une sauvegarde chiffrée pour la conserver hors de Safari.')}catch(e){alert('Échec de sauvegarde : '+(e?.message||'stockage indisponible')+'. Exporte immédiatement une sauvegarde avant de fermer l’application.');show(page)}}
function lock(){vault=null;passphrase=null;unlocked=false;$('nav').classList.add('hidden');renderLock()}
async function renderLock(){let idbValue=null;try{idbValue=await readIdb()}catch(e){}let exists=!!(idbValue||localStorage.getItem(keyName));el.innerHTML=`<section class="lock"><h2>🔐 ${exists?'Déverrouiller':'Créer un coffre chiffré'}</h2><p class="small">V3 de démonstration : données fictives uniquement. Ce coffre de TEST est distinct de celui de l'application habituelle. Les modifications sont chiffrées localement sur cet appareil.</p><label>Phrase secrète<input type="password" id="pass" autocomplete="off" placeholder="Au moins 12 caractères"></label>${exists?'':`<label>Confirmer la phrase secrète<input type="password" id="confirm" autocomplete="off"></label>`}<button id="unlock">${exists?'Déverrouiller':'Créer mon coffre'}</button><p id="error" class="danger"></p><p class="notice"><b>Attention :</b> sans la phrase secrète, les données sont irrécupérables. Sauvegarde régulièrement. Cette démo n’est pas auditée et ne doit pas recevoir de données professionnelles réelles.</p></section>`;$('unlock').onclick=async()=>{let pass=$('pass').value,err=$('error');err.textContent='';if(pass.length<12){err.textContent='Phrase secrète de 12 caractères minimum.';return}if(!exists&&pass!==$('confirm').value){err.textContent='Les deux phrases ne correspondent pas.';return}let btn=$('unlock');btn.disabled=true;try{let candidates=exists?await readCandidates(pass):[],selected=chooseCandidate(candidates);if(exists&&!selected)throw Error('Aucun coffre déchiffrable');let source=selected?.value||null;let data=selected?.data||demo();vault=migrate(data);passphrase=pass;unlocked=true;lastStoredValue=source;activeStore=selected?.name||'legacy';externalChange=false;if(!idbValue||selected?.name==='legacy')await persist();$('nav').classList.remove('hidden');show('home')}catch(e){err.textContent='Phrase incorrecte ou sauvegarde illisible.'}finally{btn.disabled=false}}}
function syndicName(id){return vault.syndics.find(x=>x.id===id)?.name||'Non rattaché'}
function siteName(id){return vault.sites.find(x=>x.id===id)?.name||'Site non renseigné'}
function show(page){if(!unlocked)return renderLock();current=page;let s='';
if(page==='home'){let total=vault.quotes.reduce((n,q)=>n+Number(q.amount||0),0);s=`<h2>Bonjour 👋</h2><p class="notice">🔬 Test isolé V3.6.9 : nouveau coffre distinct des autres versions. Ne restaure aucune ancienne sauvegarde.</p><div class="grid"><section>Résidences<h2>${vault.sites.length}</h2></section><section>Devis enregistrés HT<h2>${money(total)}</h2></section></div><section><h2>Mon espace commercial</h2><div class="grid"><button onclick="show('syndics')">🏢 Syndics</button><button onclick="show('sites')">📍 Résidences</button><button onclick="show('devis')">📄 Devis</button><button onclick="show('relances')">📅 Relances</button><button onclick="show('documents')">📎 Documents PDF</button></div></section><section><h2>🔒 Coffre et sauvegardes</h2><div class="actions"><button onclick="exportBackup()">Exporter une sauvegarde chiffrée</button><button onclick="$('restore').click()">Restaurer une sauvegarde</button><button onclick="lock()">Verrouiller</button><button class="light" onclick="verifyStorage()">Vérifier la sauvegarde locale</button></div><input class="hidden" type="file" id="restore" accept=".json,application/json" onchange="importBackup(event)"><p class="small">Une sauvegarde V2/V3 peut utiliser une autre phrase secrète : elle sera demandée si nécessaire. Une restauration remplace les modifications actuelles après confirmation. Ne restaure JAMAIS une sauvegarde du coffre principal dans ce test.</p></section><p class="notice">⚠️ Démonstration uniquement. N'ajoute aucun vrai client, contact ou document. Les chiffres de cette page sont des données fictives, pas du chiffre d'affaires réalisé.</p>`}
if(page==='syndics'){s=`<h2>Syndics fictifs</h2><section><h3>Ajouter un syndic</h3><form onsubmit="addSyndic(event)"><label>Nom du syndic<input id="sn" required maxlength="100" placeholder="Syndic Démonstration"></label><label>Interlocuteur<input id="sc" maxlength="100" placeholder="Prénom Nom"></label><label>Téléphone<input id="sp" type="tel" maxlength="40"></label><label>E-mail<input id="se" type="email" maxlength="160"></label><button type="submit">Ajouter le syndic</button></form></section>`+vault.syndics.map(x=>`<section><b>${esc(x.name)}</b><div class="muted">${esc(x.contact||'Aucun interlocuteur')} ${x.phone?' · '+esc(x.phone):''}</div>${x.email?`<div class="muted">${esc(x.email)}</div>`:''}<div class="muted">${vault.sites.filter(z=>z.syndicId===x.id).length} résidence(s)</div><div class="actions"><button class="light" onclick="showSyndic(${jsArg(x.id)})">Voir la fiche</button><button class="light" onclick="editSyndic(${jsArg(x.id)})">Modifier</button></div></section>`).join('')}
if(page==='sites'){s=`<h2>Résidences fictives</h2><section><label>🔎 Rechercher une résidence, un syndic, un gestionnaire, un numéro de site ou un devis<input id="siteSearch" type="search" placeholder="Nom, n° site, devis…" oninput="filterSites(this.value)"></label><p id="siteSearchCount" class="small"></p></section><section><h3>Ajouter une résidence</h3><form onsubmit="addSite(event)"><label>Nom<input id="rn" required maxlength="120" placeholder="Résidence Démonstration C"></label><label>N° de site<input id="rid" required maxlength="40" placeholder="DEMO-003"></label><label>Adresse<input id="ra" maxlength="160"></label><label>Ville<input id="rc" maxlength="100"></label><label>Gestionnaire<input id="rg" maxlength="100" placeholder="Nom fictif du gestionnaire"></label><label>Syndic<select id="rs">${syndicOptions('')}</select></label><button type="submit">Ajouter la résidence</button></form></section>`+vault.sites.map(x=>`<section data-site-card="1" data-search="${esc([x.name,x.id,x.address,x.city,x.gestionnaire||'',syndicName(x.syndicId),...(vault.quotes.filter(q=>q.siteId===x.id).flatMap(q=>[q.ref,q.name])),...(vault.reminders.filter(r=>r.siteId===x.id).map(r=>r.title)),...(vault.documents.filter(d=>d.siteId===x.id).map(d=>d.name))].join(' ').toLocaleLowerCase('fr'))}"><b>${esc(x.name)}</b><div class="muted">${esc(x.address||'')} ${esc(x.city||'')} · Site ${esc(x.id)}</div><div class="muted">Syndic : ${esc(syndicName(x.syndicId))} · Gestionnaire : ${esc(x.gestionnaire||'Non renseigné')}</div><div class="actions"><button class="light" onclick="showSite(${jsArg(x.id)})">Voir la fiche</button><button class="light" onclick="editSite(${jsArg(x.id)})">Modifier</button></div></section>`).join('')}
if(page==='devis'){s=`<h2>Devis fictifs</h2><section><h3>+ Nouveau devis</h3><form onsubmit="addQuote(event)"><label>Numéro de devis<input id="qref" required maxlength="60" placeholder="DEMO-D003"></label><label>Objet<input id="qname" required maxlength="160" placeholder="Maintenance extincteurs"></label><label>Résidence<select id="qsite" required><option value="">Choisir une résidence</option>${vault.sites.map(x=>`<option value="${esc(x.id)}">${esc(x.name)} — ${esc(x.id)}</option>`).join('')}</select></label><label>Montant HT (€)<input id="qamount" type="number" min="0" step="0.01" required></label><label>Date du devis<input id="qdate" type="date"></label><label>Statut<select id="qstatus">${['À confirmer','À relancer','Accepté','Refusé','Réalisé','Facturé'].map(v=>`<option>${v}</option>`).join('')}</select></label><button type="submit">Enregistrer le devis</button></form></section>`+vault.quotes.map((x,i)=>`<section><div class="row"><div><b>${esc(x.ref)}</b><div class="muted">${esc(x.name)} · ${esc(siteName(x.siteId))}</div><div class="muted">${esc(x.date||'')}${x.pdfDocId?' · 📎 PDF associé':''}</div></div><b>${money(x.amount)}</b></div><select aria-label="Statut ${esc(x.ref)}" onchange="setStatus(${i},this.value)">${['À confirmer','À relancer','Accepté','Refusé','Réalisé','Facturé'].map(v=>`<option ${x.status===v?'selected':''}>${v}</option>`).join('')}</select><button class="light" onclick="remindQuote(${i})">Programmer une relance</button></section>`).join('')}
if(page==='relances'){s=`<h2>Relances fictives</h2><section><h3>+ Nouvelle relance</h3><form onsubmit="addReminder(event)"><label>Objet<input id="title" required maxlength="160" placeholder="Relancer un devis fictif"></label><label>Résidence<select id="rsite"><option value="">Sans résidence</option>${vault.sites.map(x=>`<option value="${esc(x.id)}">${esc(x.name)} — ${esc(x.id)}</option>`).join('')}</select></label><label>Devis associé (facultatif)<select id="rquote"><option value="">Aucun</option>${vault.quotes.map(x=>`<option value="${esc(x.ref)}">${esc(x.ref)} — ${esc(x.name)}</option>`).join('')}</select></label><label>Date<input type="date" id="date" required></label><button type="submit">Enregistrer la relance</button></form></section>`+vault.reminders.map((r,i)=>`<section class="row"><div><b>${esc(r.title)}</b><div class="muted">${esc(r.date)} · ${esc(siteName(r.siteId||''))} ${r.quoteRef?' · '+esc(r.quoteRef):''}</div></div><button class="light" onclick="removeReminder(${i})">Terminé</button></section>`).join('')}

if(page==='documents'){
 s=`<h2>📎 Documents PDF fictifs</h2><section><h3>Importer et analyser plusieurs PDF</h3><p class="small">Analyse locale avec PDF.js, uniquement si les deux fichiers de bibliothèque officielle sont hébergés dans vendor/pdfjs/. Aucun PDF n’est envoyé volontairement à un service d’analyse, mais une bibliothèque externe est téléchargée. Documents fictifs uniquement. Les scans ne sont pas reconnus. Vérifie chaque proposition. </p><p class="small">Choisis plusieurs PDF fictifs, puis affecte chacun à une seule résidence. Limite de démonstration : 1,5 Mo par PDF et 3 Mo au total, pour éviter de saturer le stockage du navigateur.</p><input id="pdfInput" type="file" accept=".pdf,application/pdf" multiple onchange="preparePDFs(event)"><div id="pdfDrafts"></div></section><section><label>Rechercher un document<input id="docSearch" type="search" oninput="filterDocs(this.value)" placeholder="Nom, catégorie, résidence…"></label></section>`+vault.documents.map(d=>`<section data-doc-card data-search="${esc([d.name,d.category,siteName(d.siteId),d.siteId].join(' ').toLowerCase())}"><b>${esc(d.name)}</b><div class="muted">${esc(d.category)} · ${esc(siteName(d.siteId))} · ${Math.round(d.size/1024)} Ko</div><div class="actions"><button class="light" onclick="openPDF(${jsArg(d.id)})">Ouvrir</button>${d.category==='Devis'?`<button class="light" onclick="prepareQuoteFromPDF(${jsArg(d.id)})">Créer / voir le devis</button>`:''}<button class="light" onclick="movePDF(${jsArg(d.id)})">Changer résidence</button><button class="light" onclick="deletePDF(${jsArg(d.id)})">Supprimer</button></div></section>`).join('')
}
if(page==='exports'){
 s=`<h2>Exports PDF commerciaux</h2><section><h3>Exporter une résidence</h3><p class="small">Génère une fiche synthétique avec les informations de la résidence, son contrat global, les équipements, devis, documents et relances.</p><label>Résidence<select id="exportSite"><option value="">Choisir une résidence</option>${vault.sites.map(x=>`<option value="${esc(x.id)}">${esc(x.name)} — ${esc(x.id)}</option>`).join('')}</select></label><button onclick="exportResidencePDF()">Préparer le PDF de la résidence</button></section><section><h3>Exporter un syndic</h3><p class="small">Génère un dossier regroupant toutes les résidences rattachées au syndic, les contrats, les devis et les indicateurs commerciaux disponibles.</p><label>Syndic<select id="exportSyndic"><option value="">Choisir un syndic</option>${vault.syndics.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('')}</select></label><button onclick="exportSyndicPDF()">Préparer le PDF du syndic</button></section><p class="notice">Le PDF s'ouvre dans une fenêtre d'impression. Sur iPhone, utilise le bouton de partage puis « Enregistrer dans Fichiers » ou l'option d'impression. Vérifie les données avant de le remettre au client.</p>`
} 
if(page==='maintenance'){s='<h2>Maintenance fictive</h2><section><p>Les contrats de maintenance par résidence seront ajoutés dans une prochaine version.</p></section>'}
el.innerHTML=s}
function filterSites(value){const query=value.trim().toLocaleLowerCase('fr').normalize('NFD').replace(/[\u0300-\u036f]/g,'');let visible=0;document.querySelectorAll('[data-site-card]').forEach(card=>{const hay=(card.dataset.search||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'');const match=hay.includes(query);card.hidden=!match;if(match)visible++});let counter=$('siteSearchCount');if(counter)counter.textContent=visible+' résidence(s) trouvée(s)'}

 const changes=[],newSites=[],newSyndics=[],newQuotes=[],newDocs=[];

   else{

    const site={id:number,name,address:$('pdfaddress'+i).value.trim(),city:$('pdfcity'+i).value.trim(),syndicId:syndicId||'',gestionnaire:'',devis:0,contrat:0};
    newSites.push(site);knownSite.set(number.toUpperCase(),site);siteId=number;
   }
  }
  if(!knownSite.has(siteId.toUpperCase()))return alert('Résidence introuvable pour '+f.name);
  if(!f.data||!f.analysis)return alert('PDF incomplet, réimporte-le.');
  if(vault.documents.concat(newDocs).some(d=>d.siteId===siteId&&d.data===f.data))return alert('PDF déjà présent dans cette résidence : '+f.name);
  const doc={id:f.id,name:f.name,size:f.size,data:f.data,siteId,category,detectedReference:$('pdfref'+i).value.trim(),detectedAmount:$('pdfamount'+i).value.trim(),detectedEquipment:f.analysis.contractDetails.items||[],contractProposal:category==='Contrat de maintenance'?f.analysis.contractDetails:null};
  newDocs.push(doc);
  if(category==='Devis'&&$('pdfmakequote'+i).checked){
   const ref=$('pdfref'+i).value.trim(),name=$('pdfobject'+i).value.trim(),amountRaw=$('pdfamount'+i).value;
   const amount=Number(amountRaw);
   if(!ref||!name||amountRaw===''||!Number.isFinite(amount)||amount<0)return alert('PDF '+(i+1)+' : vérifie référence, objet et montant HT, ou décoche « Ajouter ce devis ».');
   if(knownRefs.has(normalized(ref).trim()))return alert('Le devis '+ref+' existe déjà. Décoche « Ajouter ce devis » pour conserver uniquement le PDF.');
   knownRefs.add(normalized(ref).trim());newQuotes.push({ref,name,siteId,amount,date:$('pdfdate'+i).value,status:'À confirmer',pdfDocId:doc.id});
  }
 }
 if(!confirm('Confirmer : '+newDocs.length+' PDF, '+newSites.length+' résidence(s), '+newSyndics.length+' syndic(s), '+newQuotes.length+' devis ? Vérifie les champs avant de valider.'))return;

}

function parseDetectedEuro(raw){
 const str=String(raw||'').replace(/[\s\u00a0\u202f]/g,'').replace(/€/g,'');
 if(!str)return null;
 let v=str;
 if(v.includes(',')&&v.includes('.'))v=v.lastIndexOf(',')>v.lastIndexOf('.')?v.replace(/\./g,'').replace(',','.'):v.replace(/,/g,'');
 else if(v.includes(','))v=v.replace(',','.');
 else if(/^\d{1,3}(?:\.\d{3})+$/.test(v))v=v.replace(/\./g,'');
 const n=Number(v);return Number.isFinite(n)&&n>=0?n:null;
}
